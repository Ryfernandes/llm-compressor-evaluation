[project]
name = "mle-pipelines"
version = "0.1.0"
description = "KFP pipelines for the MLE team to run in OpenShiftAI"
requires-python = ">=3.11"
dependencies = [
    "kfp>=2.16.1",
    "kfp-kubernetes>=2.16.1",
    "kubernetes>=30.1.0",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"
