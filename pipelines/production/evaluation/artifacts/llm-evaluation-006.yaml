# PIPELINE DEFINITION
# Name: llm-evaluation
# Description: Pipeline to evaluate a model from HuggingFace using vLLM, lm-eval and lighteval.
# Inputs:
#    artifacts_pvc_name: str [Default: 'evaluation-pipeline-artifacts-tier-2']
#    config_filename: str
#    configs_pvc_name: str [Default: 'evaluation-pipeline-configs-tier-2']
#    model_id: str
#    model_server_pvc_name: str [Default: 'evaluation-pipeline-model-server-tier-2']
#    num_concurrent: int [Default: 128.0]
#    session_id: str
components:
  comp-collate-results:
    executorLabel: exec-collate-results
    inputDefinitions:
      parameters:
        artifacts_pvc_mount_path:
          defaultValue: /artifacts
          isOptional: true
          parameterType: STRING
        model_id:
          parameterType: STRING
        session_id:
          parameterType: STRING
  comp-create-vllm-proxy:
    executorLabel: exec-create-vllm-proxy
    inputDefinitions:
      parameters:
        artifacts_pvc_mount_path:
          parameterType: STRING
        artifacts_pvc_name:
          parameterType: STRING
        namespace:
          defaultValue: machine-learning
          isOptional: true
          parameterType: STRING
        proxy_statistics_filename:
          defaultValue: server_proxy_statistics.jsonl
          isOptional: true
          parameterType: STRING
        service_account_name:
          defaultValue: ml-workload
          isOptional: true
          parameterType: STRING
        session_id:
          parameterType: STRING
        vllm_service_url:
          parameterType: STRING
        wait_timeout_seconds:
          defaultValue: 600.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-create-vllm-server:
    executorLabel: exec-create-vllm-server
    inputDefinitions:
      parameters:
        artifacts_pvc_mount_path:
          parameterType: STRING
        artifacts_pvc_name:
          parameterType: STRING
        config_filename:
          parameterType: STRING
        configs_pvc_mount_path:
          parameterType: STRING
        evaluation_statistics_filename:
          defaultValue: evaluation_statistics.json
          isOptional: true
          parameterType: STRING
        gib_per_gpu:
          defaultValue: 76.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        hf_secret_name:
          defaultValue: ryan-test-hf-hub-secret
          isOptional: true
          parameterType: STRING
        kv_cache_buffer_gi:
          defaultValue: 20.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        logs_filename:
          defaultValue: vllm_server.log
          isOptional: true
          parameterType: STRING
        model:
          parameterType: STRING
        model_server_pvc_name:
          parameterType: STRING
        namespace:
          defaultValue: machine-learning
          isOptional: true
          parameterType: STRING
        node_selector_key:
          defaultValue: node-role.kubernetes.io/up-h100mcp
          isOptional: true
          parameterType: STRING
        service_account_name:
          defaultValue: ml-workload
          isOptional: true
          parameterType: STRING
        session_id:
          parameterType: STRING
        tier1_storage_buffer_gi:
          defaultValue: 10.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        tier1_storage_class:
          defaultValue: lvms-h100-tier1-storage
          isOptional: true
          parameterType: STRING
        wait_timeout_seconds:
          defaultValue: 2700.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-delete-vllm-server:
    executorLabel: exec-delete-vllm-server
    inputDefinitions:
      parameters:
        delete_proxy:
          defaultValue: true
          isOptional: true
          parameterType: BOOLEAN
        delete_tier2_pvc:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        namespace:
          defaultValue: machine-learning
          isOptional: true
          parameterType: STRING
        pod_suffix:
          defaultValue: baseline-server
          isOptional: true
          parameterType: STRING
        session_id:
          parameterType: STRING
        tier2_pvc_name:
          defaultValue: evaluation-pipeline-model-server-tier-2
          isOptional: true
          parameterType: STRING
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      parameters:
        artifacts_pvc_mount_path:
          defaultValue: /artifacts
          isOptional: true
          parameterType: STRING
        model_path:
          defaultValue: Qwen/Qwen3-8B
          isOptional: true
          parameterType: STRING
        num_concurrent:
          defaultValue: 128.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        reasoning_parser:
          parameterType: STRING
        service_url:
          parameterType: STRING
        session_id:
          parameterType: STRING
        tasks:
          parameterType: STRING
  comp-exit-handler-1:
    dag:
      tasks:
        collate-results:
          cachingOptions: {}
          componentRef:
            name: comp-collate-results
          dependentTasks:
          - evaluate-model
          inputs:
            parameters:
              artifacts_pvc_mount_path:
                runtimeValue:
                  constant: /artifacts
              model_id:
                componentInputParameter: pipelinechannel--model_id
              session_id:
                componentInputParameter: pipelinechannel--session_id
          taskInfo:
            name: collate-results
        create-vllm-proxy:
          cachingOptions: {}
          componentRef:
            name: comp-create-vllm-proxy
          dependentTasks:
          - create-vllm-server
          - test-vllm-server
          inputs:
            parameters:
              artifacts_pvc_mount_path:
                runtimeValue:
                  constant: /artifacts
              artifacts_pvc_name:
                componentInputParameter: pipelinechannel--artifacts_pvc_name
              session_id:
                componentInputParameter: pipelinechannel--session_id
              vllm_service_url:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: create-vllm-server
          taskInfo:
            name: create-vllm-proxy
        create-vllm-server:
          cachingOptions: {}
          componentRef:
            name: comp-create-vllm-server
          inputs:
            parameters:
              artifacts_pvc_mount_path:
                runtimeValue:
                  constant: /artifacts
              artifacts_pvc_name:
                componentInputParameter: pipelinechannel--artifacts_pvc_name
              config_filename:
                componentInputParameter: pipelinechannel--config_filename
              configs_pvc_mount_path:
                runtimeValue:
                  constant: /configs
              model:
                componentInputParameter: pipelinechannel--model_id
              model_server_pvc_name:
                componentInputParameter: pipelinechannel--model_server_pvc_name
              session_id:
                componentInputParameter: pipelinechannel--session_id
          taskInfo:
            name: create-vllm-server
        evaluate-model:
          cachingOptions: {}
          componentRef:
            name: comp-evaluate-model
          dependentTasks:
          - create-vllm-proxy
          - test-vllm-proxy
          inputs:
            parameters:
              artifacts_pvc_mount_path:
                runtimeValue:
                  constant: /artifacts
              model_path:
                componentInputParameter: pipelinechannel--model_id
              num_concurrent:
                componentInputParameter: pipelinechannel--num_concurrent
              reasoning_parser:
                runtimeValue:
                  constant: ''
              service_url:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: create-vllm-proxy
              session_id:
                componentInputParameter: pipelinechannel--session_id
              tasks:
                runtimeValue:
                  constant: gsm8k_platinum_cot_llama
          taskInfo:
            name: evaluate-model
        test-vllm-proxy:
          cachingOptions: {}
          componentRef:
            name: comp-test-vllm-proxy
          dependentTasks:
          - create-vllm-proxy
          inputs:
            parameters:
              model:
                componentInputParameter: pipelinechannel--model_id
              proxy_url:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: create-vllm-proxy
          taskInfo:
            name: test-vllm-proxy
        test-vllm-server:
          cachingOptions: {}
          componentRef:
            name: comp-test-vllm-server
          dependentTasks:
          - create-vllm-server
          inputs:
            parameters:
              model:
                componentInputParameter: pipelinechannel--model_id
              service_url:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: create-vllm-server
          taskInfo:
            name: test-vllm-server
    inputDefinitions:
      parameters:
        pipelinechannel--artifacts_pvc_name:
          parameterType: STRING
        pipelinechannel--config_filename:
          parameterType: STRING
        pipelinechannel--configs_pvc_name:
          parameterType: STRING
        pipelinechannel--model_id:
          parameterType: STRING
        pipelinechannel--model_server_pvc_name:
          parameterType: STRING
        pipelinechannel--num_concurrent:
          parameterType: NUMBER_INTEGER
        pipelinechannel--session_id:
          parameterType: STRING
  comp-test-vllm-proxy:
    executorLabel: exec-test-vllm-proxy
    inputDefinitions:
      parameters:
        model:
          parameterType: STRING
        proxy_url:
          parameterType: STRING
  comp-test-vllm-server:
    executorLabel: exec-test-vllm-server
    inputDefinitions:
      parameters:
        model:
          parameterType: STRING
        service_url:
          parameterType: STRING
  comp-validate-session-id:
    executorLabel: exec-validate-session-id
    inputDefinitions:
      parameters:
        mount_path:
          parameterType: STRING
        session_id:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-collate-results:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - collate_results
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef collate_results(\n    session_id: str,\n    model_id: str,\n\
          \    artifacts_pvc_mount_path: str = \"/artifacts\",\n):\n    \"\"\"Collate\
          \ evaluation results from model evaluation runs.\"\"\"\n    import json\n\
          \    import os\n    import statistics\n    from collections import defaultdict\n\
          \    from datetime import datetime, timezone\n    from pathlib import Path\n\
          \n    # Metrics registry\n    METRICS_REGISTRY = {\n        \"gsm8k\": [\"\
          exact_match,strict-match\"],\n        \"gsm8k_platinum_cot_llama\": [\"\
          exact_match,strict-match\"],\n        \"mmlu_cot_llama\": [\"exact_match,strict_match\"\
          ],\n        \"mmlu_pro_chat\": [\"exact_match,custom-extract\"],\n     \
          \   \"ifeval\": [\"inst_level_strict_acc,none\"],\n        \"math_500|0\"\
          : [\"pass@k:k=1&n=1\"],\n        \"aime25|0\": [\"pass@k:k=1&n=1\"],\n \
          \       \"gpqa:diamond|0\": [\"gpqa_pass@k:k=1&n=1\"],\n        \"lcb:codegeneration_v6\"\
          : [\"codegen_pass@k:k=1&n=1\"],\n        \"mrcr\": [\"score_gt_16k_le_32k\"\
          , \"AUC\"],\n    }\n\n    def scan_json_files(directories):\n        \"\"\
          \"Recursively find all JSON files in directories with source tracking.\"\
          \"\"\n        json_files = []\n        for directory in directories:\n \
          \           dir_path = Path(directory).resolve()\n            if dir_path.exists()\
          \ and dir_path.is_dir():\n                # Track which source directory\
          \ each file came from\n                for f in dir_path.rglob(\"*.json\"\
          ):\n                    if f.is_file():\n                        json_files.append((str(f),\
          \ str(directory)))\n        return sorted(json_files, key=lambda x: x[0])\n\
          \n    def detect_framework(json_data):\n        \"\"\"Detect if results\
          \ are from LM-Eval or LightEval.\"\"\"\n        if \"config_general\" in\
          \ json_data:\n            return \"lighteval\"\n        if all(key in json_data\
          \ for key in [\"results\", \"configs\", \"config\"]):\n            return\
          \ \"lmeval\"\n        return None\n\n    def extract_lmeval_metrics(task_name,\
          \ task_results):\n        \"\"\"Extract metrics from LM-Eval format.\"\"\
          \"\n        metrics = {}\n        if task_name in METRICS_REGISTRY:\n  \
          \          for metric_key in METRICS_REGISTRY[task_name]:\n            \
          \    value = task_results.get(metric_key)\n                stderr_key =\
          \ f\"{metric_key}_stderr\"\n                stderr = task_results.get(stderr_key)\n\
          \                if stderr == \"N/A\":\n                    stderr = None\n\
          \                if value is not None:\n                    metrics[metric_key]\
          \ = {\"value\": value, \"stderr\": stderr}\n        return metrics\n\n \
          \   def extract_lmeval_result(data, task_name, source_filename):\n     \
          \   \"\"\"Extract single task result from LM-Eval.\"\"\"\n        task_results\
          \ = data[\"results\"][task_name]\n        metrics = extract_lmeval_metrics(task_name,\
          \ task_results)\n        gen_kwargs = data.get(\"config\", {}).get(\"gen_kwargs\"\
          , {})\n\n        timestamp = data.get(\"date\")\n        duration = data.get(\"\
          total_evaluation_time_seconds\")\n        if isinstance(duration, str):\n\
          \            try:\n                duration = float(duration)\n        \
          \    except (ValueError, TypeError):\n                duration = None\n\n\
          \        return {\n            \"task_name\": task_name,\n            \"\
          model_name\": data.get(\"model_name\"),\n            \"source_filename\"\
          : source_filename,\n            \"evaluation_datetime\": timestamp,\n  \
          \          \"evaluation_datetime_iso\": datetime.fromtimestamp(timestamp,\
          \ tz=timezone.utc).isoformat() if timestamp else None,\n            \"evaluation_duration_seconds\"\
          : duration,\n            \"metrics\": metrics,\n            \"inference_parameters\"\
          : {\n                \"do_sample\": gen_kwargs.get(\"do_sample\"),\n   \
          \             \"temperature\": gen_kwargs.get(\"temperature\"),\n      \
          \          \"top_p\": gen_kwargs.get(\"top_p\"),\n                \"top_k\"\
          : gen_kwargs.get(\"top_k\"),\n                \"max_gen_toks\": gen_kwargs.get(\"\
          max_gen_toks\"),\n                \"seed\": gen_kwargs.get(\"seed\"),\n\
          \            },\n        }\n\n    def parse_json_files(json_files):\n  \
          \      \"\"\"Parse all JSON files and extract results.\"\"\"\n        all_results\
          \ = []\n        for json_file_path, source_dir in json_files:\n        \
          \    try:\n                with open(json_file_path, \"r\") as f:\n    \
          \                json_data = json.load(f)\n\n                framework =\
          \ detect_framework(json_data)\n                if framework != \"lmeval\"\
          :\n                    print(f\"Skipping non-LM-Eval file: {json_file_path}\"\
          )\n                    continue\n\n                source_filename = os.path.basename(json_file_path)\n\
          \n                for task_name in json_data.get(\"results\", {}).keys():\n\
          \                    if task_name in METRICS_REGISTRY:\n               \
          \         result = extract_lmeval_result(json_data, task_name, source_filename)\n\
          \                        result[\"source_directory\"] = source_dir\n   \
          \                     all_results.append(result)\n                    else:\n\
          \                        print(f\"Skipping unknown task '{task_name}' in\
          \ {json_file_path}\")\n            except Exception as e:\n            \
          \    print(f\"ERROR parsing {json_file_path}: {e}\")\n        return all_results\n\
          \n    def compute_aggregate_stats(runs):\n        \"\"\"Compute aggregate\
          \ statistics across runs.\"\"\"\n        stats = {}\n\n        durations\
          \ = [r[\"evaluation_duration_seconds\"] for r in runs if r[\"evaluation_duration_seconds\"\
          ] is not None]\n        stats[\"evaluation_duration_seconds\"] = {\n   \
          \         \"mean\": statistics.mean(durations) if durations else None,\n\
          \            \"std\": statistics.stdev(durations) if len(durations) > 1\
          \ else 0.0\n        }\n\n        all_metric_names = set()\n        for run\
          \ in runs:\n            all_metric_names.update(run[\"metrics\"].keys())\n\
          \n        metrics_stats = {}\n        for metric_name in all_metric_names:\n\
          \            values = [run[\"metrics\"][metric_name][\"value\"] for run\
          \ in runs if metric_name in run[\"metrics\"] and run[\"metrics\"][metric_name][\"\
          value\"] is not None]\n            stderrs = [run[\"metrics\"][metric_name][\"\
          stderr\"] for run in runs if metric_name in run[\"metrics\"] and run[\"\
          metrics\"][metric_name][\"stderr\"] is not None]\n\n            metrics_stats[metric_name]\
          \ = {\n                \"value\": {\n                    \"mean\": statistics.mean(values)\
          \ if values else None,\n                    \"std\": statistics.stdev(values)\
          \ if len(values) > 1 else 0.0\n                },\n                \"stderr\"\
          : {\n                    \"mean\": statistics.mean(stderrs) if stderrs else\
          \ None,\n                    \"std\": statistics.stdev(stderrs) if len(stderrs)\
          \ > 1 else 0.0\n                }\n            }\n        stats[\"metrics\"\
          ] = metrics_stats\n        return stats\n\n    def parse_vllm_metrics(logs_path):\n\
          \        \"\"\"Parse vLLM metrics JSONL logs.\"\"\"\n        if not logs_path.exists():\n\
          \            print(f\"No vLLM metrics found at {logs_path}\")\n        \
          \    return {}\n\n        task_seed_metrics = {}\n        try:\n       \
          \     with open(logs_path, \"r\") as f:\n                for line in f:\n\
          \                    if not line.strip():\n                        continue\n\
          \                    try:\n                        entry = json.loads(line)\n\
          \                        task_id = entry.get(\"task_id\")\n            \
          \            seed = entry.get(\"seed\")\n                        metrics\
          \ = entry.get(\"metrics\")\n                        if task_id is not None\
          \ and seed is not None and metrics is not None:\n                      \
          \      task_seed_metrics[(task_id, seed)] = metrics\n                  \
          \  except json.JSONDecodeError as e:\n                        print(f\"\
          ERROR parsing vLLM metrics line: {e}\")\n        except Exception as e:\n\
          \            print(f\"ERROR reading vLLM metrics: {e}\")\n            return\
          \ {}\n\n        return task_seed_metrics\n\n    def aggregate_vllm_metrics_by_task(task_seed_metrics):\n\
          \        \"\"\"Aggregate vLLM metrics at the task level across all seeds.\"\
          \"\"\n        # Group by task_id\n        metrics_by_task = defaultdict(list)\n\
          \        for (task_id, seed), metrics in task_seed_metrics.items():\n  \
          \          metrics_by_task[task_id].append(metrics)\n\n        # Aggregate\
          \ per task\n        task_aggregates = {}\n        for task_id, metrics_list\
          \ in metrics_by_task.items():\n            # Collect all values across seeds\
          \ for numeric fields\n            queue_time_sums = [m[\"queue_time_sum_seconds\"\
          ] for m in metrics_list if \"queue_time_sum_seconds\" in m]\n          \
          \  queue_time_counts = [m[\"queue_time_count\"] for m in metrics_list if\
          \ \"queue_time_count\" in m]\n            queue_time_avgs = [m[\"queue_time_avg_seconds\"\
          ] for m in metrics_list if \"queue_time_avg_seconds\" in m]\n          \
          \  preemptions = [m[\"preemptions_total\"] for m in metrics_list if \"preemptions_total\"\
          \ in m]\n            prompt_tokens = [m[\"prompt_tokens_total\"] for m in\
          \ metrics_list if \"prompt_tokens_total\" in m]\n            generation_tokens\
          \ = [m[\"generation_tokens_total\"] for m in metrics_list if \"generation_tokens_total\"\
          \ in m]\n            total_tokens = [m[\"total_tokens\"] for m in metrics_list\
          \ if \"total_tokens\" in m]\n            throughputs = [m[\"throughput_tokens_per_second\"\
          ] for m in metrics_list if \"throughput_tokens_per_second\" in m]\n    \
          \        durations = [m[\"duration_seconds\"] for m in metrics_list if \"\
          duration_seconds\" in m]\n\n            aggregate = {\n                \"\
          queue_time_sum_seconds\": sum(queue_time_sums) if queue_time_sums else 0,\n\
          \                \"queue_time_count\": sum(queue_time_counts) if queue_time_counts\
          \ else 0,\n                \"queue_time_avg_seconds\": statistics.mean(queue_time_avgs)\
          \ if queue_time_avgs else 0,\n                \"preemptions_total\": sum(preemptions)\
          \ if preemptions else 0,\n                \"prompt_tokens_total\": sum(prompt_tokens)\
          \ if prompt_tokens else 0,\n                \"generation_tokens_total\"\
          : sum(generation_tokens) if generation_tokens else 0,\n                \"\
          total_tokens\": sum(total_tokens) if total_tokens else 0,\n            \
          \    \"throughput_tokens_per_second\": statistics.mean(throughputs) if throughputs\
          \ else 0,\n                \"duration_seconds\": sum(durations) if durations\
          \ else 0,\n                \"num_seeds\": len(metrics_list),\n         \
          \   }\n\n            task_aggregates[task_id] = aggregate\n\n        return\
          \ task_aggregates\n\n    def parse_proxy_logs(logs_path):\n        \"\"\"\
          Parse proxy JSONL logs and compute statistics per task/seed.\"\"\"\n   \
          \     if not logs_path.exists():\n            print(f\"No proxy logs found\
          \ at {logs_path}\")\n            return {}, {}\n\n        # Group logs by\
          \ (task_id, seed) and by task_id alone\n        logs_by_task_seed = defaultdict(list)\n\
          \        logs_by_task = defaultdict(list)\n\n        try:\n            with\
          \ open(logs_path, \"r\") as f:\n                for line in f:\n       \
          \             if not line.strip():\n                        continue\n \
          \                   try:\n                        entry = json.loads(line)\n\
          \                        task_id = entry.get(\"task_id\")\n            \
          \            seed = entry.get(\"seed\")\n                        if task_id\
          \ is not None and seed is not None:\n                            logs_by_task_seed[(task_id,\
          \ seed)].append(entry)\n                            logs_by_task[task_id].append(entry)\n\
          \                    except json.JSONDecodeError as e:\n               \
          \         print(f\"ERROR parsing proxy log line: {e}\")\n        except\
          \ Exception as e:\n            print(f\"ERROR reading proxy logs: {e}\"\
          )\n            return {}, {}\n\n        # Compute statistics per task/seed\n\
          \        task_seed_stats = {}\n        for (task_id, seed), entries in logs_by_task_seed.items():\n\
          \            stats = compute_proxy_stats(entries)\n            task_seed_stats[(task_id,\
          \ seed)] = stats\n\n        return task_seed_stats, logs_by_task\n\n   \
          \ def compute_proxy_stats(entries):\n        \"\"\"Compute min/max/mean/p95/p99\
          \ for tokens and latency, and finish_reason counts.\"\"\"\n        if not\
          \ entries:\n            return None\n\n        # Extract numeric fields\
          \ (filtering out None values)\n        prompt_tokens = [e[\"prompt_tokens\"\
          ] for e in entries if e.get(\"prompt_tokens\") is not None]\n        completion_tokens\
          \ = [e[\"completion_tokens\"] for e in entries if e.get(\"completion_tokens\"\
          ) is not None]\n        total_tokens = [e[\"total_tokens\"] for e in entries\
          \ if e.get(\"total_tokens\") is not None]\n        latencies = [e[\"latency_seconds\"\
          ] for e in entries if e.get(\"latency_seconds\") is not None]\n\n      \
          \  def compute_percentile(values, percentile):\n            \"\"\"Compute\
          \ percentile using sorted values.\"\"\"\n            if not values:\n  \
          \              return None\n            sorted_vals = sorted(values)\n \
          \           n = len(sorted_vals)\n            k = (n - 1) * percentile /\
          \ 100.0\n            f = int(k)\n            c = k - f\n            if f\
          \ + 1 < n:\n                return sorted_vals[f] * (1 - c) + sorted_vals[f\
          \ + 1] * c\n            return sorted_vals[f]\n\n        def stats_dict(values):\n\
          \            \"\"\"Compute min/max/mean/p95/p99 for a list of values.\"\"\
          \"\n            if not values:\n                return None\n          \
          \  return {\n                \"min\": min(values),\n                \"max\"\
          : max(values),\n                \"mean\": statistics.mean(values),\n   \
