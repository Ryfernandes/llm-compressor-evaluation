          : 32000, \"max_length\": 40192, \"reps\": 3},\n        (\"mmlu_pro_chat\"\
          , True): {\"n_shots\": 0, \"max_gen_toks\": 32000, \"max_length\": 40192,\
          \ \"reps\": 3},\n        (\"ifeval\", True): {\"n_shots\": 0, \"max_gen_toks\"\
          : 32000, \"max_length\": 40192, \"reps\": 3},\n        (\"math_500\", True):\
          \ {\"n_shots\": 0, \"max_gen_toks\": 32000, \"max_length\": 40192, \"reps\"\
          : 3},\n        (\"aime25\", True): {\"n_shots\": 0, \"max_gen_toks\": 32000,\
          \ \"max_length\": 40192, \"reps\": 8},\n        (\"gpqa:diamond\", True):\
          \ {\"n_shots\": 0, \"max_gen_toks\": 32000, \"max_length\": 40192, \"reps\"\
          : 3},\n        (\"lcb:codegeneration_v6\", True): {\"n_shots\": 0, \"max_gen_toks\"\
          : 32000, \"max_length\": 40192, \"reps\": 3},\n        (\"mrcr\", True):\
          \ {\"n_shots\": 0, \"max_gen_toks\": 32000, \"max_length\": 40192, \"reps\"\
          : 3},\n    }\n\n    # Default configuration if task not found\n    DEFAULT_CONFIG\
          \ = {\"n_shots\": 5, \"max_gen_toks\": 4096, \"max_length\": 32768, \"reps\"\
          : 1}\n\n    # Determine if reasoning is enabled\n    reasoning_enabled =\
          \ bool(reasoning_parser and reasoning_parser.strip())\n\n    # Parse and\
          \ clean task list\n    task_list = [task.strip() for task in tasks.split(\"\
          ,\") if task.strip()]\n\n    # Setup paths\n    session_dir = Path(artifacts_pvc_mount_path)\
          \ / \"evaluation-artifacts\" / \"sessions\" / session_id\n    results_dir\
          \ = session_dir / \"results\"\n    results_dir.mkdir(parents=True, exist_ok=True)\n\
          \    logs_dir = session_dir / \"logs\"\n    logs_dir.mkdir(parents=True,\
          \ exist_ok=True)\n    tmp_dir = session_dir / \"tmp\"\n    tmp_dir.mkdir(exist_ok=True)\n\
          \n    # Setup vLLM metrics log file\n    vllm_metrics_log = logs_dir / \"\
          vllm_metrics.jsonl\"\n\n    # Change to session directory\n    os.chdir(session_dir)\n\
          \n    # Ensure service_url uses the correct format for base_url\n    base_url\
          \ = service_url.rstrip(\"/\") + \"/v1\"\n\n    # Helper functions for proxy\
          \ control\n    def set_proxy_task(task_id: str, seed: int):\n        \"\"\
          \"Set the task_id and seed in the proxy.\"\"\"\n        response = requests.post(\n\
          \            f\"{service_url}/set-proxy-task\",\n            json={\"task_id\"\
          : task_id, \"seed\": seed},\n            timeout=10\n        )\n       \
          \ response.raise_for_status()\n        print(f\"Proxy task set: task_id={task_id},\
          \ seed={seed}\")\n\n    def enable_proxy_logging():\n        \"\"\"Enable\
          \ logging in the proxy.\"\"\"\n        response = requests.post(f\"{service_url}/start-logging\"\
          , timeout=10)\n        response.raise_for_status()\n        print(\"Proxy\
          \ logging enabled\")\n\n    def disable_proxy_logging():\n        \"\"\"\
          Disable logging in the proxy.\"\"\"\n        response = requests.post(f\"\
          {service_url}/stop-logging\", timeout=10)\n        response.raise_for_status()\n\
          \        print(\"Proxy logging disabled\")\n\n    def get_vllm_metrics():\n\
          \        \"\"\"Fetch and parse vLLM Prometheus metrics.\"\"\"\n        try:\n\
          \            response = requests.get(f\"{service_url}/metrics\", timeout=30)\n\
          \            response.raise_for_status()\n\n            metrics = {}\n \
          \           for family in text_string_to_metric_families(response.text):\n\
          \                if family.name == \"vllm:request_queue_time_seconds\":\n\
          \                    for sample in family.samples:\n                   \
          \     if sample.name == \"vllm:request_queue_time_seconds_sum\":\n     \
          \                       metrics[\"queue_time_sum\"] = sample.value\n   \
          \                     elif sample.name == \"vllm:request_queue_time_seconds_count\"\
          :\n                            metrics[\"queue_time_count\"] = sample.value\n\
          \                elif family.name == \"vllm:num_preemptions_total\":\n \
          \                   for sample in family.samples:\n                    \
          \    metrics[\"preemptions_total\"] = sample.value\n                elif\
          \ family.name == \"vllm:prompt_tokens_total\":\n                    for\
          \ sample in family.samples:\n                        metrics[\"prompt_tokens_total\"\
          ] = sample.value\n                elif family.name == \"vllm:generation_tokens_total\"\
          :\n                    for sample in family.samples:\n                 \
          \       metrics[\"generation_tokens_total\"] = sample.value\n\n        \
          \    return metrics\n        except Exception as e:\n            print(f\"\
          WARNING: Failed to fetch vLLM metrics: {e}\")\n            return {}\n\n\
          \    def compute_metric_deltas(start_metrics, end_metrics, duration_seconds):\n\
          \        \"\"\"Compute deltas between start and end metrics.\"\"\"\n   \
          \     if not start_metrics or not end_metrics:\n            return None\n\
          \n        delta = {}\n\n        # Queue time metrics\n        queue_time_sum_delta\
          \ = end_metrics.get(\"queue_time_sum\", 0) - start_metrics.get(\"queue_time_sum\"\
          , 0)\n        queue_time_count_delta = end_metrics.get(\"queue_time_count\"\
          , 0) - start_metrics.get(\"queue_time_count\", 0)\n\n        delta[\"queue_time_sum_seconds\"\
          ] = queue_time_sum_delta\n        delta[\"queue_time_count\"] = queue_time_count_delta\n\
          \        delta[\"queue_time_avg_seconds\"] = queue_time_sum_delta / queue_time_count_delta\
          \ if queue_time_count_delta > 0 else 0\n\n        # Preemptions\n      \
          \  delta[\"preemptions_total\"] = end_metrics.get(\"preemptions_total\"\
          , 0) - start_metrics.get(\"preemptions_total\", 0)\n\n        # Token counts\n\
          \        prompt_tokens_delta = end_metrics.get(\"prompt_tokens_total\",\
          \ 0) - start_metrics.get(\"prompt_tokens_total\", 0)\n        generation_tokens_delta\
          \ = end_metrics.get(\"generation_tokens_total\", 0) - start_metrics.get(\"\
          generation_tokens_total\", 0)\n        total_tokens_delta = prompt_tokens_delta\
          \ + generation_tokens_delta\n\n        delta[\"prompt_tokens_total\"] =\
          \ prompt_tokens_delta\n        delta[\"generation_tokens_total\"] = generation_tokens_delta\n\
          \        delta[\"total_tokens\"] = total_tokens_delta\n\n        # Throughput\
          \ (tokens per second)\n        delta[\"throughput_tokens_per_second\"] =\
          \ total_tokens_delta / duration_seconds if duration_seconds > 0 else 0\n\
          \        delta[\"duration_seconds\"] = duration_seconds\n\n        return\
          \ delta\n\n    try:\n        for task_tag in task_list:\n            print(f\"\
          \\n{'='*60}\")\n            print(f\"Evaluating task: {task_tag}\")\n  \
          \          print(f\"{'='*60}\\n\")\n\n            # Get configuration for\
          \ this task\n            config_key = (task_tag, reasoning_enabled)\n  \
          \          config = EVAL_CONFIG.get(config_key, DEFAULT_CONFIG)\n\n    \
          \        n_shots = config[\"n_shots\"]\n            max_gen_toks = config[\"\
          max_gen_toks\"]\n            max_length = config[\"max_length\"]\n     \
          \       reps = config[\"reps\"]\n\n            print(f\"Configuration: n_shots={n_shots},\
          \ max_gen_toks={max_gen_toks}, max_length={max_length}, reps={reps}, reasoning_enabled={reasoning_enabled}\"\
          )\n\n            for i in range(1, reps + 1):\n                print(f\"\
          Evaluation Run {i}/{reps}\")\n\n                seed = 1233 + i\n\n    \
          \            # Configure proxy for this task/seed\n                set_proxy_task(task_tag,\
          \ seed)\n                enable_proxy_logging()\n\n                # Collect\
          \ vLLM metrics before evaluation\n                start_metrics = get_vllm_metrics()\n\
          \                start_time_eval = time.time()\n\n                # Build\
          \ lm_eval command\n                cmd = [\n                    \"python\"\
          , \"-m\", \"lm_eval\",\n                    \"--model\", \"local-chat-completions\"\
          ,\n                    \"--tasks\", task_tag,\n                    \"--model_args\"\
          , (\n                        f\"model={model_path},\"\n                \
          \        f\"max_length={max_length},\"\n                        f\"base_url={base_url}/chat/completions,\"\
          \n                        f\"num_concurrent={num_concurrent},\"\n      \
          \                  f\"max_retries=3,\"\n                        f\"tokenized_requests=False,\"\
          \n                        f\"tokenizer_backend=None,\"\n               \
          \         f\"timeout=1200\"\n                    ),\n                  \
          \  \"--num_fewshot\", str(n_shots),\n                    \"--apply_chat_template\"\
          ,\n                    \"--fewshot_as_multiturn\",\n                   \
          \ \"--output_path\", str(tmp_dir),\n                    \"--seed\", str(seed),\n\
          \                    \"--gen_kwargs\", (\n                        f\"do_sample=True,\"\
          \n                        f\"temperature=0.6,\"\n                      \
          \  f\"top_p=0.9,\"\n                        f\"top_k=50,\"\n           \
          \             f\"max_gen_toks={max_gen_toks},\"\n                      \
          \  f\"seed={seed}\"\n                    ),\n                ]\n\n     \
          \           # Run evaluation\n                result = subprocess.run(cmd,\
          \ check=True, capture_output=True, text=True)\n                print(result.stdout)\n\
          \                if result.stderr:\n                    print(\"STDERR:\"\
          , result.stderr)\n\n                # Collect vLLM metrics after evaluation\n\
          \                end_time_eval = time.time()\n                end_metrics\
          \ = get_vllm_metrics()\n                duration_seconds = end_time_eval\
          \ - start_time_eval\n\n                # Compute metric deltas\n       \
          \         metric_deltas = compute_metric_deltas(start_metrics, end_metrics,\
          \ duration_seconds)\n\n                # Log metrics to JSONL\n        \
          \        if metric_deltas:\n                    log_entry = {\n        \
          \                \"task_id\": task_tag,\n                        \"seed\"\
          : seed,\n                        \"metrics\": metric_deltas,\n         \
          \               \"timestamp\": end_time_eval,\n                    }\n \
          \                   with open(vllm_metrics_log, \"a\") as f:\n         \
          \               f.write(json.dumps(log_entry) + \"\\n\")\n             \
          \       print(f\"vLLM metrics logged: {metric_deltas}\")\n\n           \
          \     # Disable proxy logging after evaluation completes\n             \
          \   disable_proxy_logging()\n\n                print(f\"Evaluation complete,\
          \ tried moving output to {str(tmp_dir)}\")\n\n                json_files\
          \ = list(tmp_dir.rglob(\"*.json\"))\n\n                if json_files:\n\
          \                    # Use the first (or only) results file found\n    \
          \                json_file = json_files[0]\n                    output_name\
          \ = f\"{task_tag}_seed_{seed}.json\"\n                    output_path =\
          \ results_dir / output_name\n\n                    # Copy instead of rename\
          \ to avoid cross-device link errors\n                    import shutil\n\
          \                    shutil.copy2(json_file, output_path)\n            \
          \        print(f\"Saved results to: {output_path}\")\n                 \
          \   print(f\"Source file: {json_file}\")\n                else:\n      \
          \              print(f\"WARNING: No JSON output found for {task_tag} run\
          \ {i}\")\n                    # Debug: list what's actually in tmp_dir\n\
          \                    print(f\"Contents of {tmp_dir}:\")\n              \
          \      for item in tmp_dir.rglob(\"*\"):\n                        print(f\"\
          \  {item}\")\n\n                # Clean tmp directory\n                for\
          \ file in tmp_dir.iterdir():\n                    if file.is_file():\n \
          \                       file.unlink()\n                    elif file.is_dir():\n\
          \                        import shutil\n                        shutil.rmtree(file)\n\
          \n        print(f\"\\n{'='*60}\")\n        print(f\"All evaluations complete.\
          \ Results saved to: {results_dir}\")\n        print(f\"{'='*60}\")\n\n \
          \   finally:\n        # Cleanup tmp directory\n        if tmp_dir.exists():\n\
          \            import shutil\n            shutil.rmtree(tmp_dir)\n\n"
