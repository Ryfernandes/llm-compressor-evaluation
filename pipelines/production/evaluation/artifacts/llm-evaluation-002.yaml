# PIPELINE DEFINITION
# Name: llm-evaluation
# Description: Pipeline to evaluate a model from HuggingFace using vLLM, lm-eval and lighteval.
# Inputs:
#    artifacts_pvc_name: str [Default: 'evaluation-pipeline-artifacts-tier-2']
#    config_filename: str
#    configs_pvc_name: str [Default: 'evaluation-pipeline-configs-tier-2']
#    model_id: str
#    model_server_pvc_name: str [Default: 'evaluation-pipeline-model-server-tier-2']
#    session_id: str
components:
  comp-create-vllm-proxy:
    executorLabel: exec-create-vllm-proxy
    inputDefinitions:
      parameters:
        artifacts_pvc_mount_path:
          parameterType: STRING
        artifacts_pvc_name:
          parameterType: STRING
        namespace:
          defaultValue: machine-learning
          isOptional: true
          parameterType: STRING
        proxy_statistics_filename:
          defaultValue: server_proxy_statistics.jsonl
          isOptional: true
          parameterType: STRING
        service_account_name:
          defaultValue: ml-workload
          isOptional: true
          parameterType: STRING
        session_id:
          parameterType: STRING
        vllm_service_url:
          parameterType: STRING
        wait_timeout_seconds:
          defaultValue: 600.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-create-vllm-server:
    executorLabel: exec-create-vllm-server
    inputDefinitions:
      parameters:
        artifacts_pvc_mount_path:
          parameterType: STRING
        artifacts_pvc_name:
          parameterType: STRING
        config_filename:
          parameterType: STRING
        configs_pvc_mount_path:
          parameterType: STRING
        evaluation_statistics_filename:
          defaultValue: evaluation_statistics.json
          isOptional: true
          parameterType: STRING
        gib_per_gpu:
          defaultValue: 76.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        hf_secret_name:
          defaultValue: ryan-test-hf-hub-secret
          isOptional: true
          parameterType: STRING
        kv_cache_buffer_gi:
          defaultValue: 20.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        logs_filename:
          defaultValue: vllm_server.log
          isOptional: true
          parameterType: STRING
        model:
          parameterType: STRING
        model_server_pvc_name:
          parameterType: STRING
        namespace:
          defaultValue: machine-learning
          isOptional: true
          parameterType: STRING
        node_selector_key:
          defaultValue: node-role.kubernetes.io/up-h100mcp
          isOptional: true
          parameterType: STRING
        service_account_name:
          defaultValue: ml-workload
          isOptional: true
          parameterType: STRING
        session_id:
          parameterType: STRING
        tier1_storage_buffer_gi:
          defaultValue: 10.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        tier1_storage_class:
          defaultValue: lvms-h100-tier1-storage
          isOptional: true
          parameterType: STRING
        wait_timeout_seconds:
          defaultValue: 2700.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-delete-vllm-server:
    executorLabel: exec-delete-vllm-server
    inputDefinitions:
      parameters:
        delete_proxy:
          defaultValue: true
          isOptional: true
          parameterType: BOOLEAN
        delete_tier2_pvc:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        namespace:
          defaultValue: machine-learning
          isOptional: true
          parameterType: STRING
        pod_suffix:
          defaultValue: baseline-server
          isOptional: true
          parameterType: STRING
        session_id:
          parameterType: STRING
        tier2_pvc_name:
          defaultValue: evaluation-pipeline-model-server-tier-2
          isOptional: true
          parameterType: STRING
  comp-exit-handler-1:
    dag:
      tasks:
        create-vllm-proxy:
          cachingOptions: {}
          componentRef:
            name: comp-create-vllm-proxy
          dependentTasks:
          - create-vllm-server
          - test-vllm-server
          inputs:
            parameters:
              artifacts_pvc_mount_path:
                runtimeValue:
                  constant: /artifacts
              artifacts_pvc_name:
                componentInputParameter: pipelinechannel--artifacts_pvc_name
              session_id:
                componentInputParameter: pipelinechannel--session_id
              vllm_service_url:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: create-vllm-server
          taskInfo:
            name: create-vllm-proxy
        create-vllm-server:
          cachingOptions: {}
          componentRef:
            name: comp-create-vllm-server
          inputs:
            parameters:
              artifacts_pvc_mount_path:
                runtimeValue:
                  constant: /artifacts
              artifacts_pvc_name:
                componentInputParameter: pipelinechannel--artifacts_pvc_name
              config_filename:
                componentInputParameter: pipelinechannel--config_filename
              configs_pvc_mount_path:
                runtimeValue:
                  constant: /configs
              model:
                componentInputParameter: pipelinechannel--model_id
              model_server_pvc_name:
                componentInputParameter: pipelinechannel--model_server_pvc_name
              session_id:
                componentInputParameter: pipelinechannel--session_id
          taskInfo:
            name: create-vllm-server
        test-vllm-proxy:
          cachingOptions: {}
          componentRef:
            name: comp-test-vllm-proxy
          dependentTasks:
          - create-vllm-proxy
          inputs:
            parameters:
              model:
                componentInputParameter: pipelinechannel--model_id
              proxy_url:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: create-vllm-proxy
          taskInfo:
            name: test-vllm-proxy
        test-vllm-server:
          cachingOptions: {}
          componentRef:
            name: comp-test-vllm-server
          dependentTasks:
          - create-vllm-server
          inputs:
            parameters:
              model:
                componentInputParameter: pipelinechannel--model_id
              service_url:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: create-vllm-server
          taskInfo:
            name: test-vllm-server
    inputDefinitions:
      parameters:
        pipelinechannel--artifacts_pvc_name:
          parameterType: STRING
        pipelinechannel--config_filename:
          parameterType: STRING
        pipelinechannel--configs_pvc_name:
          parameterType: STRING
        pipelinechannel--model_id:
          parameterType: STRING
        pipelinechannel--model_server_pvc_name:
          parameterType: STRING
        pipelinechannel--session_id:
          parameterType: STRING
  comp-test-vllm-proxy:
    executorLabel: exec-test-vllm-proxy
    inputDefinitions:
      parameters:
        model:
          parameterType: STRING
        proxy_url:
          parameterType: STRING
  comp-test-vllm-server:
    executorLabel: exec-test-vllm-server
    inputDefinitions:
      parameters:
        model:
          parameterType: STRING
        service_url:
          parameterType: STRING
  comp-validate-session-id:
    executorLabel: exec-validate-session-id
    inputDefinitions:
      parameters:
        mount_path:
          parameterType: STRING
        session_id:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-create-vllm-proxy:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - create_vllm_proxy
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kubernetes'\
          \ 'fastapi' 'uvicorn' 'httpx'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef create_vllm_proxy(\n    # Session spec\n    session_id: str,\n\
          \    # vLLM server URL\n    vllm_service_url: str,\n    # PVC spec\n   \
          \ artifacts_pvc_name: str,\n    artifacts_pvc_mount_path: str,\n    # Pod\
          \ spec\n    namespace: str = \"machine-learning\",\n    service_account_name:\
          \ str = \"ml-workload\",\n    # Timeout spec\n    wait_timeout_seconds:\
          \ int = 600,\n    # Logs spec\n    proxy_statistics_filename: str = \"server_proxy_statistics.jsonl\"\
          ,\n) -> str:\n    import time\n    import os\n    from pathlib import Path\n\
          \    from kubernetes import client, config\n    from kubernetes.client.rest\
          \ import ApiException\n\n    config.load_incluster_config()\n    core =\
          \ client.CoreV1Api()\n\n    session_path = Path(artifacts_pvc_mount_path)\
          \ / \"evaluation-artifacts\" / \"sessions\" / session_id\n    if not session_path.exists():\n\
          \        raise FileNotFoundError(f\"Session path {session_path} does not\
          \ exist. Ensure validate_session_id has been run.\")\n\n    logs_path =\
          \ session_path / \"logs\"\n    logs_path.mkdir(parents=True, exist_ok=True)\n\
          \n    pod_name = f\"evals-vllm-proxy-{session_id}\"\n    service_name =\
          \ f\"{pod_name}-svc\"\n\n    labels = {\n        \"app.kubernetes.io/instance\"\
          : pod_name,\n    }\n\n    service_url = f\"http://{service_name}.{namespace}.svc.cluster.local:8000\"\
          \n\n    # Python script for the proxy server\n    proxy_script = r'''\n\
          import asyncio\nimport json\nimport time\nimport uuid\nfrom pathlib import\
          \ Path\nfrom typing import Optional\n\nfrom fastapi import FastAPI, Request,\
          \ Response, HTTPException\nimport httpx\nimport uvicorn\nimport os\n\napp\
          \ = FastAPI()\n\nVLLM_BASE_URL = os.environ[\"VLLM_SERVICE_URL\"]\nLOGS_PATH\
          \ = Path(os.environ[\"LOGS_PATH\"])\n\nclass ProxyLogger:\n    def __init__(self,\
          \ logs_path: Path):\n        self.logs_path = logs_path\n        self.logs_path.parent.mkdir(parents=True,\
          \ exist_ok=True)\n        self.logging_enabled = True\n        self.task_id\
          \ = None\n        self.seed = None\n\n    def set_task(self, task_id: Optional[str],\
          \ seed: Optional[int]):\n        self.task_id = task_id\n        self.seed\
          \ = seed\n\n    def enable_logging(self):\n        self.logging_enabled\
          \ = True\n\n    def disable_logging(self):\n        self.logging_enabled\
          \ = False\n\n    def log_request(\n        self,\n        request_id: str,\n\
          \        finish_reason: str,\n        prompt_tokens: Optional[int],\n  \
          \      completion_tokens: Optional[int],\n        total_tokens: Optional[int],\n\
          \        latency_seconds: float,\n    ):\n        if not self.logging_enabled:\n\
          \            return\n\n        log_entry = {\n            \"request_id\"\
          : request_id,\n            \"task_id\": self.task_id,\n            \"seed\"\
          : self.seed,\n            \"finish_reason\": finish_reason,\n          \
          \  \"prompt_tokens\": prompt_tokens,\n            \"completion_tokens\"\
          : completion_tokens,\n            \"total_tokens\": total_tokens,\n    \
          \        \"latency_seconds\": latency_seconds,\n            \"timestamp\"\
          : time.time(),\n        }\n\n        with open(self.logs_path, \"a\") as\
          \ f:\n            f.write(json.dumps(log_entry) + \"\\n\")\n\nlogger = ProxyLogger(LOGS_PATH)\n\
          \n@app.get(\"/health\")\nasync def health():\n    return {\"status\": \"\
          healthy\"}\n\n@app.post(\"/set-proxy-task\")\nasync def set_proxy_task(request:\
          \ Request):\n    body = await request.json()\n    task_id = body.get(\"\
          task_id\")\n    seed = body.get(\"seed\")\n    logger.set_task(task_id,\
          \ seed)\n    return {\n        \"status\": \"success\",\n        \"task_id\"\
          : logger.task_id,\n        \"seed\": logger.seed\n    }\n\n@app.post(\"\
          /start-logging\")\nasync def start_logging():\n    logger.enable_logging()\n\
          \    return {\"status\": \"success\", \"logging_enabled\": logger.logging_enabled}\n\
          \n@app.post(\"/stop-logging\")\nasync def stop_logging():\n    logger.disable_logging()\n\
          \    return {\"status\": \"success\", \"logging_enabled\": logger.logging_enabled}\n\
          \n@app.api_route(\"/{path:path}\", methods=[\"GET\", \"POST\", \"PUT\",\
          \ \"DELETE\", \"PATCH\", \"OPTIONS\", \"HEAD\"])\nasync def proxy(path:\
          \ str, request: Request):\n    request_id = str(uuid.uuid4())\n    start_time\
          \ = time.time()\n\n    # Build the target URL\n    target_url = f\"{VLLM_BASE_URL}/{path}\"\
          \n\n    # Get request body\n    body = await request.body()\n\n    # Check\
          \ if this is a completions endpoint (only log these)\n    is_completions_endpoint\
          \ = \"completions\" in path\n\n    # Check for streaming requests and reject\
          \ them (only on completions endpoints)\n    if is_completions_endpoint:\n\
          \        try:\n            if body:\n                body_json = json.loads(body)\n\
          \                if body_json.get(\"stream\", False):\n                \
          \    raise HTTPException(status_code=400, detail=\"Streaming requests are\
          \ not supported by this proxy\")\n        except json.JSONDecodeError:\n\
          \            pass\n\n    # Forward headers (excluding host)\n    headers\
          \ = dict(request.headers)\n    headers.pop(\"host\", None)\n\n    async\
          \ with httpx.AsyncClient(timeout=httpx.Timeout(600.0)) as client:\n    \
          \    try:\n            # Handle non-streaming responses\n            if\
          \ is_completions_endpoint:\n                # Log completions requests\n\
          \                return await handle_non_streaming_request(\n          \
          \          client, request_id, start_time, target_url, request.method, headers,\
          \ body, should_log=True\n                )\n            else:\n        \
          \        # Don't log non-completions requests\n                return await\
          \ handle_non_streaming_request(\n                    client, request_id,\
          \ start_time, target_url, request.method, headers, body, should_log=False\n\
          \                )\n\n        except httpx.TimeoutException:\n         \
          \   # Client timeout - only log if completions endpoint\n            if\
          \ is_completions_endpoint:\n                latency = time.time() - start_time\n\
          \                logger.log_request(\n                    request_id=request_id,\n\
          \                    finish_reason=\"timeout\",\n                    prompt_tokens=None,\n\
          \                    completion_tokens=None,\n                    total_tokens=None,\n\
          \                    latency_seconds=latency,\n                )\n     \
          \       raise HTTPException(status_code=504, detail=\"Gateway Timeout\"\
          )\n\n        except Exception as e:\n            # Other errors - only log\
          \ if completions endpoint\n            if is_completions_endpoint:\n   \
          \             latency = time.time() - start_time\n                logger.log_request(\n\
          \                    request_id=request_id,\n                    finish_reason=\"\
          error\",\n                    prompt_tokens=None,\n                    completion_tokens=None,\n\
          \                    total_tokens=None,\n                    latency_seconds=latency,\n\
          \                )\n            raise\n\nasync def handle_non_streaming_request(\n\
          \    client: httpx.AsyncClient,\n    request_id: str,\n    start_time: float,\n\
          \    target_url: str,\n    method: str,\n    headers: dict,\n    body: bytes,\n\
          \    should_log: bool = True,\n):\n    # Forward the request\n    response\
          \ = await client.request(\n        method=method,\n        url=target_url,\n\
          \        headers=headers,\n        content=body,\n    )\n\n    latency =\
          \ time.time() - start_time\n\n    # Only log if requested (completions endpoints\
          \ only)\n    if should_log:\n        # Parse response to extract token usage\n\
          \        finish_reason = None\n        prompt_tokens = None\n        completion_tokens\
          \ = None\n        total_tokens = None\n\n        try:\n            response_json\
          \ = response.json()\n\n            # Extract usage information (OpenAI API\
          \ format)\n            if \"usage\" in response_json:\n                usage\
          \ = response_json[\"usage\"]\n                prompt_tokens = usage.get(\"\
          prompt_tokens\")\n                completion_tokens = usage.get(\"completion_tokens\"\
          )\n                total_tokens = usage.get(\"total_tokens\")\n\n      \
          \      # Extract finish reason from first choice\n            if \"choices\"\
          \ in response_json and len(response_json[\"choices\"]) > 0:\n          \
          \      finish_reason = response_json[\"choices\"][0].get(\"finish_reason\"\
          )\n\n        except (json.JSONDecodeError, KeyError, IndexError):\n    \
          \        pass\n\n        # Log the request\n        logger.log_request(\n\
          \            request_id=request_id,\n            finish_reason=finish_reason\
          \ or \"unknown\",\n            prompt_tokens=prompt_tokens,\n          \
          \  completion_tokens=completion_tokens,\n            total_tokens=total_tokens,\n\
          \            latency_seconds=latency,\n        )\n\n    # Return response\
          \ to client\n    return Response(\n        content=response.content,\n \
          \       status_code=response.status_code,\n        headers=dict(response.headers),\n\
          \    )\n\nif __name__ == \"__main__\":\n    uvicorn.run(app, host=\"0.0.0.0\"\
          , port=8000, log_level=\"info\")\n'''\n\n    # Create wrapper script to\
          \ set up environment and run proxy\n    script = r'''\nset -eu\n\necho \"\
          [*] Installing required packages...\"\npip install --no-cache-dir fastapi\
          \ uvicorn httpx\n\n# Write the proxy server code\ncat > /tmp/proxy_server.py\
          \ << 'PROXY_EOF'\n''' + proxy_script + r'''\nPROXY_EOF\n\necho \"[*] Starting\
          \ vLLM proxy server...\"\necho \"[*] Proxying requests to: ${VLLM_SERVICE_URL}\"\
          \necho \"[*] Logging to: ${LOGS_PATH}\"\n\nexec python /tmp/proxy_server.py\n\
          '''\n\n    pod_manifest = {\n        \"apiVersion\": \"v1\",\n        \"\
          kind\": \"Pod\",\n        \"metadata\": {\n            \"name\": pod_name,\n\
          \            \"namespace\": namespace,\n            \"labels\": labels,\n\
          \        },\n        \"spec\": {\n            \"restartPolicy\": \"Never\"\
          ,\n            \"serviceAccountName\": service_account_name,\n         \
          \   \"containers\": [\n                {\n                    \"name\":\
          \ \"vllm-proxy\",\n                    \"image\": \"python:3.12\",\n   \
          \                 \"ports\": [\n                        {\n            \
          \                \"name\": \"http\",\n                            \"containerPort\"\
          : 8000,\n                            \"protocol\": \"TCP\",\n          \
          \              }\n                    ],\n                    \"command\"\
          : [\"/bin/bash\", \"-c\", script],\n                    \"readinessProbe\"\
          : {\n                        \"httpGet\": {\n                          \
          \  \"path\": \"/health\",\n                            \"port\": \"http\"\
          ,\n                        },\n                        \"initialDelaySeconds\"\
          : 10,\n                        \"periodSeconds\": 5,\n                 \
          \       \"timeoutSeconds\": 3,\n                        \"failureThreshold\"\
          : 20,\n                    },\n                    \"env\": [\n        \
          \                {\"name\": \"VLLM_SERVICE_URL\", \"value\": vllm_service_url},\n\
          \                        {\"name\": \"LOGS_PATH\", \"value\": str(logs_path\
          \ / proxy_statistics_filename)},\n                    ],\n             \
          \       \"volumeMounts\": [\n                        {\"name\": \"artifacts\"\
          , \"mountPath\": artifacts_pvc_mount_path},\n                    ],\n  \
          \              }\n            ],\n            \"volumes\": [\n         \
          \       {\n                    \"name\": \"artifacts\",\n              \
          \      \"persistentVolumeClaim\": {\n                        \"claimName\"\
          : artifacts_pvc_name,\n                    },\n                }\n     \
          \       ],\n        },\n    }\n\n    service_manifest = {\n        \"apiVersion\"\
          : \"v1\",\n        \"kind\": \"Service\",\n        \"metadata\": {\n   \
          \         \"name\": service_name,\n            \"namespace\": namespace,\n\
          \        },\n        \"spec\": {\n            \"type\": \"ClusterIP\",\n\
          \            \"selector\": labels,\n            \"ports\": [\n         \
          \       {\n                    \"name\": \"http\",\n                   \
          \ \"protocol\": \"TCP\",\n                    \"port\": 8000,\n        \
          \            \"targetPort\": \"http\",\n                }\n            ],\n\
          \        },\n    }\n\n    def delete_pod_if_exists() -> None:\n        try:\n\
          \            core.delete_namespaced_pod(name=pod_name, namespace=namespace)\n\
          \            print(f\"Deleted existing proxy pod {pod_name}; waiting for\
          \ deletion...\")\n        except ApiException as e:\n            if e.status\
          \ != 404:\n                raise\n            return\n\n        deadline\
          \ = time.time() + 300\n        while time.time() < deadline:\n         \
          \   try:\n                core.read_namespaced_pod(name=pod_name, namespace=namespace)\n\
          \                time.sleep(5)\n            except ApiException as e:\n\
          \                if e.status == 404:\n                    return\n     \
          \           raise\n        raise TimeoutError(f\"Timed out waiting for old\
          \ proxy pod {pod_name} to delete\")\n\n    def create_or_patch_service()\
          \ -> None:\n        try:\n            core.create_namespaced_service(namespace=namespace,\
          \ body=service_manifest)\n            print(f\"Created proxy service {service_name}\"\
          )\n        except ApiException as e:\n            if e.status == 409:\n\
          \                core.patch_namespaced_service(\n                    name=service_name,\n\
          \                    namespace=namespace,\n                    body=service_manifest,\n\
          \                )\n                print(f\"Patched existing proxy service\
          \ {service_name}\")\n            else:\n                raise\n\n    def\
          \ create_pod() -> None:\n        core.create_namespaced_pod(namespace=namespace,\
          \ body=pod_manifest)\n        print(f\"Created proxy pod {pod_name}\")\n\
          \n    def wait_for_pod_ready() -> None:\n        deadline = time.time()\
          \ + wait_timeout_seconds\n\n        while time.time() < deadline:\n    \
          \        pod = core.read_namespaced_pod(name=pod_name, namespace=namespace)\n\
          \            phase = pod.status.phase\n            conditions = pod.status.conditions\
          \ or []\n\n            ready = any(\n                condition.type == \"\
          Ready\" and condition.status == \"True\"\n                for condition\
          \ in conditions\n            )\n\n            print(f\"Proxy pod phase={phase},\
          \ ready={ready}\")\n\n            if ready:\n                return\n\n\
          \            if phase in {\"Failed\", \"Succeeded\"}:\n                raise\
          \ RuntimeError(f\"Proxy pod ended before becoming ready: phase={phase}\"\
          )\n\n            time.sleep(5)\n\n        raise TimeoutError(f\"Timed out\
          \ waiting for proxy pod {pod_name} to become ready\")\n\n    create_or_patch_service()\n\
          \    delete_pod_if_exists()\n    create_pod()\n    wait_for_pod_ready()\n\
          \n    print(f\"vLLM proxy service URL: {service_url}\")\n    return service_url\n\
          \n"
        image: python:3.12
    exec-create-vllm-server:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - create_vllm_server
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kubernetes'\
          \ 'requests' 'huggingface-hub'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef create_vllm_server(\n    # Model spec\n    model: str,\n    #\
          \ Session spec\n    session_id: str,\n    # Evaluation spec\n    config_filename:\
