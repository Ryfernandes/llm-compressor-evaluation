          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef test_vllm_server(\n    # Model spec\n    model: str,\n    # Service\
          \ spec\n    service_url: str,\n) -> None:\n    import json\n    import requests\n\
          \n    models_url = f\"{service_url}/v1/models\"\n    print(f\"Checking {models_url}\"\
          )\n\n    models_response = requests.get(models_url, timeout=30)\n    models_response.raise_for_status()\n\
          \    print(json.dumps(models_response.json(), indent=2))\n\n    chat_url\
          \ = f\"{service_url}/v1/chat/completions\"\n    payload = {\n        \"\
          model\": model,\n        \"messages\": [\n            {\n              \
          \  \"role\": \"user\",\n                \"content\": \"Briefly explain methods\
          \ to evaluate large language models.\",\n            }\n        ],\n   \
          \     \"max_tokens\": 2048,\n        \"temperature\": 0.6,\n        \"chat_template_kwargs\"\
          : {\n            \"enable_thinking\": True,\n        },\n    }\n\n    response\
          \ = requests.post(chat_url, json=payload, timeout=120)\n    response.raise_for_status()\n\
          \n    data = response.json()\n    print(json.dumps(data, indent=2))\n  \
          \  print(\"Assistant response:\")\n    print(data[\"choices\"][0][\"message\"\
          ][\"content\"])\n\n    print(\"Test inference successful\")\n\n"
        image: python:3.12
    exec-validate-session-id:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - validate_session_id
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef validate_session_id(session_id: str, mount_path: str) -> None:\n\
          \    \"\"\"\n    Validate that the session_id is unique. It should not\n\
          \    match the name of any directory already in the artifacts\n    PVC.\
          \ If it does, raise a ValueError. If it does not, create\n    the session\
          \ directory to \"claim\" the session_id.\n    \"\"\"\n\n    from pathlib\
          \ import Path\n\n    artifacts_path = Path(mount_path) / \"evaluation-artifacts\"\
          \ / \"sessions\"\n    if not artifacts_path.exists():\n        raise ValueError(f\"\
          Artifacts path {artifacts_path} does not exist\")\n\n    existing_sessions\
          \ = [d.name for d in artifacts_path.iterdir() if d.is_dir()]\n    if session_id\
          \ in existing_sessions:\n        raise ValueError(f\"Session ID '{session_id}'\
          \ already exists in {artifacts_path}\")\n\n    # Create the session directory\
          \ to \"claim\" the session_id\n    session_path = artifacts_path / session_id\n\
          \    session_path.mkdir(parents=True, exist_ok=False)\n\n"
        image: python:3.11
pipelineInfo:
  description: Pipeline to evaluate a model from HuggingFace using vLLM, lm-eval and
    lighteval.
  name: llm-evaluation
root:
  dag:
    tasks:
      delete-vllm-server:
        cachingOptions: {}
        componentRef:
          name: comp-delete-vllm-server
        dependentTasks:
        - exit-handler-1
        inputs:
          parameters:
            session_id:
              componentInputParameter: session_id
        taskInfo:
          name: delete-vllm-server
        triggerPolicy:
          strategy: ALL_UPSTREAM_TASKS_COMPLETED
      exit-handler-1:
        componentRef:
          name: comp-exit-handler-1
        dependentTasks:
        - validate-session-id
        inputs:
          parameters:
            pipelinechannel--artifacts_pvc_name:
              componentInputParameter: artifacts_pvc_name
            pipelinechannel--config_filename:
              componentInputParameter: config_filename
            pipelinechannel--configs_pvc_name:
              componentInputParameter: configs_pvc_name
            pipelinechannel--model_id:
              componentInputParameter: model_id
            pipelinechannel--model_server_pvc_name:
              componentInputParameter: model_server_pvc_name
            pipelinechannel--session_id:
              componentInputParameter: session_id
        taskInfo:
          name: exit-handler-1
      validate-session-id:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-validate-session-id
        inputs:
          parameters:
            mount_path:
              runtimeValue:
                constant: /artifacts
            session_id:
              componentInputParameter: session_id
        taskInfo:
          name: validate-session-id
  inputDefinitions:
    parameters:
      artifacts_pvc_name:
        defaultValue: evaluation-pipeline-artifacts-tier-2
        isOptional: true
        parameterType: STRING
      config_filename:
        parameterType: STRING
      configs_pvc_name:
        defaultValue: evaluation-pipeline-configs-tier-2
        isOptional: true
        parameterType: STRING
      model_id:
        parameterType: STRING
      model_server_pvc_name:
        defaultValue: evaluation-pipeline-model-server-tier-2
        isOptional: true
        parameterType: STRING
      session_id:
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-create-vllm-proxy:
          pvcMount:
          - componentInputParameter: pipelinechannel--artifacts_pvc_name
            mountPath: /artifacts
            pvcNameParameter:
              componentInputParameter: pipelinechannel--artifacts_pvc_name
        exec-create-vllm-server:
          pvcMount:
          - componentInputParameter: pipelinechannel--model_server_pvc_name
            mountPath: /server
            pvcNameParameter:
              componentInputParameter: pipelinechannel--model_server_pvc_name
          - componentInputParameter: pipelinechannel--configs_pvc_name
            mountPath: /configs
            pvcNameParameter:
              componentInputParameter: pipelinechannel--configs_pvc_name
          - componentInputParameter: pipelinechannel--artifacts_pvc_name
            mountPath: /artifacts
            pvcNameParameter:
              componentInputParameter: pipelinechannel--artifacts_pvc_name
          secretAsEnv:
          - keyToEnv:
            - envVar: HF_TOKEN
              secretKey: HF_TOKEN
            optional: false
            secretName: ryan-test-hf-hub-secret
            secretNameParameter:
              runtimeValue:
                constant: ryan-test-hf-hub-secret
        exec-validate-session-id:
          pvcMount:
          - componentInputParameter: artifacts_pvc_name
            mountPath: /artifacts
            pvcNameParameter:
              componentInputParameter: artifacts_pvc_name
