          \    import json\n    import os\n    import time\n    import uuid\n    from\
          \ pathlib import Path\n    from urllib.parse import quote\n    import requests\n\
          \n    # Read GitHub token from environment variable\n    github_token =\
          \ os.environ.get(\"GITHUB_TOKEN\")\n    if not github_token:\n        raise\
          \ ValueError(\"GITHUB_TOKEN environment variable not set\")\n\n    def github_request(method,\
          \ url, token, json_data=None):\n        \"\"\"Helper function for GitHub\
          \ API requests.\"\"\"\n        resp = requests.request(\n            method,\n\
          \            url,\n            headers={\n                \"Accept\": \"\
          application/vnd.github+json\",\n                \"Authorization\": f\"Bearer\
          \ {token}\",\n                \"X-GitHub-Api-Version\": \"2022-11-28\",\n\
          \            },\n            json=json_data,\n            timeout=30,\n\
          \        )\n\n        if not resp.ok:\n            raise RuntimeError(\n\
          \                f\"GitHub API request failed: {method} {url}\\n\"\n   \
          \             f\"Status: {resp.status_code}\\n\"\n                f\"Response:\
          \ {resp.text}\"\n            )\n\n        if resp.status_code == 204:\n\
          \            return {}\n\n        return resp.json()\n\n    GITHUB_API =\
          \ \"https://api.github.com\"\n\n    # Find the collated results file\n \
          \   collated_path = Path(save_path) / \"sessions\" / session_id / \"collated\"\
          \ / \"collated_results.json\"\n\n    if not collated_path.is_file():\n \
          \       raise FileNotFoundError(f\"Collated results file not found: {collated_path}\"\
          )\n\n    # Load and parse collated results\n    with open(collated_path,\
          \ \"r\") as f:\n        collated_data = json.load(f)\n\n    metadata = collated_data.get(\"\
          metadata\", {})\n    model_id = metadata.get(\"model_id\", \"unknown-model\"\
          )\n    compression_recipe = metadata.get(\"compression_recipe\", \"N/A\"\
          )\n    baseline_results = collated_data.get(\"baseline_results\", [])\n\
          \    compressed_results = collated_data.get(\"compressed_results\", [])\n\
          \n    # Create a timestamped filename for the upload\n    filename = f\"\
          collated-{session_id}.json\"\n\n    # GitHub repository paths should not\
          \ start with \"/\"\n    repo_results_dir = repo_results_dir.strip(\"/\"\
          )\n    repo_file_path = f\"{repo_results_dir}/{filename}\"\n\n    print(f\"\
          Uploading {collated_path} to {owner}/{repo}:{repo_file_path}\")\n\n    #\
          \ 1. Get the current commit SHA of base branch\n    ref_path = quote(f\"\
          heads/{base_branch}\", safe=\"/\")\n    base_ref = github_request(\n   \
          \     \"GET\",\n        f\"{GITHUB_API}/repos/{owner}/{repo}/git/ref/{ref_path}\"\
          ,\n        github_token,\n    )\n    base_sha = base_ref[\"object\"][\"\
          sha\"]\n\n    # 2. Create a unique branch from base\n    unique_suffix =\
          \ f\"{int(time.time())}-{uuid.uuid4().hex[:6]}\"\n    branch_name = f\"\
          add-result-{session_id}-{unique_suffix}\"\n\n    github_request(\n     \
          \   \"POST\",\n        f\"{GITHUB_API}/repos/{owner}/{repo}/git/refs\",\n\
          \        github_token,\n        json_data={\n            \"ref\": f\"refs/heads/{branch_name}\"\
          ,\n            \"sha\": base_sha,\n        },\n    )\n\n    # 3. Commit\
          \ the file to the new branch\n    file_bytes = collated_path.read_bytes()\n\
          \    encoded_content = base64.b64encode(file_bytes).decode(\"ascii\")\n\n\
          \    commit_message = f\"Add evaluation results for session {session_id}\"\
          \n\n    contents_path = quote(repo_file_path, safe=\"/\")\n    github_request(\n\
          \        \"PUT\",\n        f\"{GITHUB_API}/repos/{owner}/{repo}/contents/{contents_path}\"\
          ,\n        github_token,\n        json_data={\n            \"message\":\
          \ commit_message,\n            \"content\": encoded_content,\n         \
          \   \"branch\": branch_name,\n        },\n    )\n\n    # 4. Format PR body\
          \ with aggregate stats\n    def format_results_table(results, result_type):\n\
          \        \"\"\"Format results as a markdown table.\"\"\"\n        if not\
          \ results:\n            return f\"No {result_type} results available.\\\
          n\"\n\n        lines = [f\"### {result_type.title()} Results\\n\"]\n   \
          \     lines.append(\"| Task | Metric | Mean | Std Dev | Reps |\")\n    \
          \    lines.append(\"|------|--------|------|---------|------|\")\n\n   \
          \     for result in sorted(results, key=lambda x: x[\"task_name\"]):\n \
          \           task_name = result[\"task_name\"]\n            aggregate_stats\
          \ = result.get(\"aggregate_stats\", {})\n            metrics = aggregate_stats.get(\"\
          metrics\", {})\n            num_reps = result.get(\"num_repetitions\", 0)\n\
          \n            for metric_name, metric_data in metrics.items():\n       \
          \         value_stats = metric_data.get(\"value\", {})\n               \
          \ mean = value_stats.get(\"mean\")\n                std = value_stats.get(\"\
          std\")\n\n                mean_str = f\"{mean:.4f}\" if mean is not None\
          \ else \"N/A\"\n                std_str = f\"{std:.4f}\" if std is not None\
          \ else \"N/A\"\n\n                lines.append(f\"| {task_name} | {metric_name}\
          \ | {mean_str} | {std_str} | {num_reps} |\")\n\n        return \"\\n\".join(lines)\n\
          \n    pr_body_lines = [\n        f\"## Evaluation Results: {model_id}\"\
          ,\n        \"\",\n        f\"**Session ID:** `{session_id}`\",\n       \
          \ f\"**Model:** `{model_id}`\",\n        \"\",\n        \"**Compression\
          \ Recipe:**\",\n        \"```yaml\",\n        compression_recipe.strip(),\n\
          \        \"```\",\n        \"\",\n        format_results_table(baseline_results,\
          \ \"baseline\"),\n        \"\",\n        format_results_table(compressed_results,\
          \ \"compressed\"),\n        \"\",\n        f\"**Full results file:** `{repo_file_path}`\"\
          ,\n    ]\n\n    pr_body = \"\\n\".join(pr_body_lines)\n    pr_title = f\"\
          Evaluation results: {model_id} (session {session_id})\"\n\n    pr_response\
          \ = github_request(\n        \"POST\",\n        f\"{GITHUB_API}/repos/{owner}/{repo}/pulls\"\
          ,\n        github_token,\n        json_data={\n            \"title\": pr_title,\n\
          \            \"head\": branch_name,\n            \"base\": base_branch,\n\
          \            \"body\": pr_body,\n        },\n    )\n\n    pr_url = pr_response[\"\
          html_url\"]\n    pr_number = pr_response[\"number\"]\n\n    print(f\"Created\
          \ PR #{pr_number}: {pr_url}\")\n\n    return f\"Created PR #{pr_number}:\
          \ {pr_url}\"\n\n"
        image: python:3.12
pipelineInfo:
  name: full-eval-pipeline
root:
  dag:
    tasks:
      cleanup-model-staging:
        cachingOptions: {}
        componentRef:
          name: comp-cleanup-model-staging
        dependentTasks:
        - generate-session-id
        - test-vllm-server-2
        inputs:
          parameters:
            session_id:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: generate-session-id
        taskInfo:
          name: cleanup-model-staging
      collate-results:
        cachingOptions: {}
        componentRef:
          name: comp-collate-results
        dependentTasks:
        - delete-vllm-server
        - delete-vllm-server-2
        - generate-session-id
        inputs:
          parameters:
            compression_recipe:
              componentInputParameter: compression_recipe
            model_id:
              componentInputParameter: model_id
            session_id:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: generate-session-id
        taskInfo:
          name: collate-results
      compress-model:
        cachingOptions:
          enableCache: true
        componentRef:
          name: comp-compress-model
        inputs:
          parameters:
            model_id:
              componentInputParameter: model_id
            recipe:
              componentInputParameter: compression_recipe
        taskInfo:
          name: compress-model
      create-vllm-server:
        cachingOptions: {}
        componentRef:
          name: comp-create-vllm-server
        dependentTasks:
        - generate-session-id
        inputs:
          parameters:
            model:
              componentInputParameter: model_id
            pod_suffix:
              runtimeValue:
                constant: b
            reasoning_parser:
              componentInputParameter: reasoning_parser
            session_id:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: generate-session-id
        taskInfo:
          name: create-vllm-server
      create-vllm-server-2:
        cachingOptions: {}
        componentRef:
          name: comp-create-vllm-server-2
        dependentTasks:
        - compress-model
        - generate-session-id
        inputs:
          artifacts:
            input_model:
              taskOutputArtifact:
                outputArtifactKey: output_model
                producerTask: compress-model
          parameters:
            pod_suffix:
              runtimeValue:
                constant: c
            reasoning_parser:
              componentInputParameter: reasoning_parser
            session_id:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: generate-session-id
        taskInfo:
          name: create-vllm-server-2
      delete-vllm-server:
        cachingOptions: {}
        componentRef:
          name: comp-delete-vllm-server
        dependentTasks:
        - evaluate-model
        - generate-session-id
        inputs:
          parameters:
            delete_tier2_pvc:
              runtimeValue:
                constant: false
            pod_suffix:
              runtimeValue:
                constant: b
            session_id:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: generate-session-id
        taskInfo:
          name: delete-vllm-server
      delete-vllm-server-2:
        cachingOptions: {}
        componentRef:
          name: comp-delete-vllm-server-2
        dependentTasks:
        - evaluate-model-2
        - generate-session-id
        inputs:
          parameters:
            delete_tier2_pvc:
              runtimeValue:
                constant: false
            pod_suffix:
              runtimeValue:
                constant: c
            session_id:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: generate-session-id
        taskInfo:
          name: delete-vllm-server-2
      evaluate-model:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-model
        dependentTasks:
        - generate-session-id
        - test-vllm-server
        inputs:
          parameters:
            model_path:
              componentInputParameter: model_id
            reasoning_parser:
              componentInputParameter: reasoning_parser
            save_prefix:
              runtimeValue:
                constant: baseline
            service_url:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: test-vllm-server
            session_id:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: generate-session-id
            tasks:
              componentInputParameter: evaluation_tasks
        taskInfo:
          name: evaluate-model
      evaluate-model-2:
        cachingOptions: {}
        componentRef:
          name: comp-evaluate-model-2
        dependentTasks:
        - generate-session-id
        - test-vllm-server-2
        inputs:
          parameters:
            model_path:
              componentInputParameter: model_id
            reasoning_parser:
              componentInputParameter: reasoning_parser
            save_prefix:
              runtimeValue:
                constant: compressed
            service_url:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: test-vllm-server-2
            session_id:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: generate-session-id
            tasks:
              componentInputParameter: evaluation_tasks
        taskInfo:
          name: evaluate-model-2
      generate-session-id:
        cachingOptions: {}
        componentRef:
          name: comp-generate-session-id
        taskInfo:
          name: generate-session-id
      test-vllm-server:
        cachingOptions: {}
        componentRef:
          name: comp-test-vllm-server
        dependentTasks:
        - create-vllm-server
        inputs:
          parameters:
            model:
              componentInputParameter: model_id
            service_url:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: create-vllm-server
        taskInfo:
          name: test-vllm-server
      test-vllm-server-2:
        cachingOptions: {}
        componentRef:
          name: comp-test-vllm-server-2
        dependentTasks:
        - create-vllm-server-2
        inputs:
          parameters:
            model:
              componentInputParameter: model_id
            service_url:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: create-vllm-server-2
        taskInfo:
          name: test-vllm-server-2
      upload-results-to-github:
        cachingOptions: {}
        componentRef:
          name: comp-upload-results-to-github
        dependentTasks:
        - collate-results
        - generate-session-id
        inputs:
          parameters:
            session_id:
              taskOutputParameter:
                outputParameterKey: Output
                producerTask: generate-session-id
        taskInfo:
          name: upload-results-to-github
  inputDefinitions:
    parameters:
      compression_recipe:
        defaultValue: "\n        quant_stage:\n            quant_modifiers:\n    \
          \            QuantizationModifier:\n                    ignore: [\"lm_head\"\
          ]\n                    targets: [\"Linear\"]\n                    scheme:\
          \ \"W4A16\"\n        "
        isOptional: true
        parameterType: STRING
      evaluation_tasks:
        defaultValue: gsm8k_platinum_cot_llama
        isOptional: true
        parameterType: STRING
      model_id:
        defaultValue: Qwen/Qwen3-8B
        isOptional: true
        parameterType: STRING
      pvc_name:
        defaultValue: evaluation-pipeline-artifacts-tier-2
        isOptional: true
        parameterType: STRING
      reasoning_parser:
        defaultValue: ''
        isOptional: true
        parameterType: STRING
schemaVersion: 2.1.0
sdkVersion: kfp-2.16.1
---
platforms:
  kubernetes:
    deploymentSpec:
      executors:
        exec-cleanup-model-staging:
          pvcMount:
          - constant: evaluation-pipeline-model-server-tier-2
            mountPath: /tier2
            pvcNameParameter:
              runtimeValue:
                constant: evaluation-pipeline-model-server-tier-2
        exec-collate-results:
          pvcMount:
          - componentInputParameter: pvc_name
            mountPath: /tier2
            pvcNameParameter:
              componentInputParameter: pvc_name
        exec-create-vllm-server:
          pvcMount:
          - constant: evaluation-pipeline-model-server-tier-2
            mountPath: /tier2
            pvcNameParameter:
              runtimeValue:
                constant: evaluation-pipeline-model-server-tier-2
        exec-create-vllm-server-2:
          pvcMount:
          - constant: evaluation-pipeline-model-server-tier-2
            mountPath: /tier2
            pvcNameParameter:
              runtimeValue:
                constant: evaluation-pipeline-model-server-tier-2
        exec-evaluate-model:
          pvcMount:
          - componentInputParameter: pvc_name
            mountPath: /tier2
            pvcNameParameter:
              componentInputParameter: pvc_name
        exec-evaluate-model-2:
          pvcMount:
          - componentInputParameter: pvc_name
            mountPath: /tier2
            pvcNameParameter:
              componentInputParameter: pvc_name
        exec-upload-results-to-github:
          pvcMount:
          - componentInputParameter: pvc_name
            mountPath: /tier2
            pvcNameParameter:
              componentInputParameter: pvc_name
          secretAsEnv:
          - keyToEnv:
            - envVar: GITHUB_TOKEN
              secretKey: GITHUB_TOKEN
            optional: false
            secretName: evaluation-pipeline-results-gh
            secretNameParameter:
              runtimeValue:
                constant: evaluation-pipeline-results-gh
