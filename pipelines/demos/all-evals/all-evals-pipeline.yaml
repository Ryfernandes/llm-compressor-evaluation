deploymentSpec:
  executors:
    exec-cleanup-model-staging:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - cleanup_model_staging
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef cleanup_model_staging(\n    session_id: str,\n    tier2_mount_path:\
          \ str = \"/tier2\",\n) -> None:\n    import shutil\n    from pathlib import\
          \ Path\n\n    tier2_staging_dir = Path(tier2_mount_path) / \"model-staging\"\
          \ / session_id\n\n    if tier2_staging_dir.exists():\n        print(f\"\
          [*] Cleaning up tier2 staging directory: {tier2_staging_dir}\")\n      \
          \  shutil.rmtree(tier2_staging_dir)\n        print(f\"[+] Tier2 staging\
          \ directory removed\")\n    else:\n        print(f\"[*] Tier2 staging directory\
          \ does not exist (already cleaned up): {tier2_staging_dir}\")\n\n"
        image: python:3.12
    exec-collate-results:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - collate_results
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef collate_results(\n    session_id: str,\n    model_id: str,\n\
          \    compression_recipe: str,\n    save_path: str = \"/tier2/evaluations\"\
          ,\n):\n    \"\"\"Collate evaluation results from baseline and compressed\
          \ model runs.\"\"\"\n    import json\n    import os\n    import statistics\n\
          \    from collections import defaultdict\n    from datetime import datetime,\
          \ timezone\n    from pathlib import Path\n\n    # Metrics registry\n   \
          \ METRICS_REGISTRY = {\n        \"gsm8k\": [\"exact_match,strict-match\"\
          ],\n        \"gsm8k_platinum_cot_llama\": [\"exact_match,strict-match\"\
          ],\n        \"mmlu_cot_llama\": [\"exact_match,strict_match\"],\n      \
          \  \"mmlu_pro_chat\": [\"exact_match,custom-extract\"],\n        \"ifeval\"\
          : [\"inst_level_strict_acc,none\"],\n        \"math_500|0\": [\"pass@k:k=1&n=1\"\
          ],\n        \"aime25|0\": [\"pass@k:k=1&n=1\"],\n        \"gpqa:diamond|0\"\
          : [\"gpqa_pass@k:k=1&n=1\"],\n        \"lcb:codegeneration_v6\": [\"codegen_pass@k:k=1&n=1\"\
          ],\n        \"mrcr\": [\"score_gt_16k_le_32k\", \"AUC\"],\n    }\n\n   \
          \ def scan_json_files(directories):\n        \"\"\"Recursively find all\
          \ JSON files in directories with source tracking.\"\"\"\n        json_files\
          \ = []\n        for directory in directories:\n            dir_path = Path(directory).resolve()\n\
          \            if dir_path.exists() and dir_path.is_dir():\n             \
          \   # Track which source directory each file came from\n               \
          \ for f in dir_path.rglob(\"*.json\"):\n                    if f.is_file():\n\
          \                        json_files.append((str(f), str(directory)))\n \
          \       return sorted(json_files, key=lambda x: x[0])\n\n    def detect_framework(json_data):\n\
          \        \"\"\"Detect if results are from LM-Eval or LightEval.\"\"\"\n\
          \        if \"config_general\" in json_data:\n            return \"lighteval\"\
          \n        if all(key in json_data for key in [\"results\", \"configs\",\
          \ \"config\"]):\n            return \"lmeval\"\n        return None\n\n\
          \    def extract_lmeval_metrics(task_name, task_results):\n        \"\"\"\
          Extract metrics from LM-Eval format.\"\"\"\n        metrics = {}\n     \
          \   if task_name in METRICS_REGISTRY:\n            for metric_key in METRICS_REGISTRY[task_name]:\n\
          \                value = task_results.get(metric_key)\n                stderr_key\
          \ = f\"{metric_key}_stderr\"\n                stderr = task_results.get(stderr_key)\n\
          \                if stderr == \"N/A\":\n                    stderr = None\n\
          \                if value is not None:\n                    metrics[metric_key]\
          \ = {\"value\": value, \"stderr\": stderr}\n        return metrics\n\n \
          \   def extract_lmeval_result(data, task_name, source_filename):\n     \
          \   \"\"\"Extract single task result from LM-Eval.\"\"\"\n        task_results\
          \ = data[\"results\"][task_name]\n        metrics = extract_lmeval_metrics(task_name,\
          \ task_results)\n        gen_kwargs = data.get(\"config\", {}).get(\"gen_kwargs\"\
          , {})\n\n        timestamp = data.get(\"date\")\n        duration = data.get(\"\
          total_evaluation_time_seconds\")\n        if isinstance(duration, str):\n\
          \            try:\n                duration = float(duration)\n        \
          \    except (ValueError, TypeError):\n                duration = None\n\n\
          \        return {\n            \"task_name\": task_name,\n            \"\
          model_name\": data.get(\"model_name\"),\n            \"source_filename\"\
          : source_filename,\n            \"evaluation_datetime\": timestamp,\n  \
          \          \"evaluation_datetime_iso\": datetime.fromtimestamp(timestamp,\
          \ tz=timezone.utc).isoformat() if timestamp else None,\n            \"evaluation_duration_seconds\"\
          : duration,\n            \"metrics\": metrics,\n            \"inference_parameters\"\
          : {\n                \"do_sample\": gen_kwargs.get(\"do_sample\"),\n   \
          \             \"temperature\": gen_kwargs.get(\"temperature\"),\n      \
          \          \"top_p\": gen_kwargs.get(\"top_p\"),\n                \"top_k\"\
          : gen_kwargs.get(\"top_k\"),\n                \"max_gen_toks\": gen_kwargs.get(\"\
          max_gen_toks\"),\n                \"seed\": gen_kwargs.get(\"seed\"),\n\
          \            },\n        }\n\n    def parse_json_files(json_files):\n  \
          \      \"\"\"Parse all JSON files and extract results.\"\"\"\n        all_results\
          \ = []\n        for json_file_path, source_dir in json_files:\n        \
          \    try:\n                with open(json_file_path, \"r\") as f:\n    \
          \                json_data = json.load(f)\n\n                framework =\
          \ detect_framework(json_data)\n                if framework != \"lmeval\"\
          :\n                    print(f\"Skipping non-LM-Eval file: {json_file_path}\"\
          )\n                    continue\n\n                source_filename = os.path.basename(json_file_path)\n\
          \n                # Determine model type from source directory\n       \
          \         model_type = \"compressed\" if \"compressed\" in source_dir else\
          \ \"baseline\"\n\n                for task_name in json_data.get(\"results\"\
          , {}).keys():\n                    if task_name in METRICS_REGISTRY:\n \
          \                       result = extract_lmeval_result(json_data, task_name,\
          \ source_filename)\n                        result[\"model_type\"] = model_type\n\
          \                        result[\"source_directory\"] = source_dir\n   \
          \                     all_results.append(result)\n                    else:\n\
          \                        print(f\"Skipping unknown task '{task_name}' in\
          \ {json_file_path}\")\n            except Exception as e:\n            \
          \    print(f\"ERROR parsing {json_file_path}: {e}\")\n        return all_results\n\
          \n    def compute_aggregate_stats(runs):\n        \"\"\"Compute aggregate\
          \ statistics across runs.\"\"\"\n        stats = {}\n\n        durations\
          \ = [r[\"evaluation_duration_seconds\"] for r in runs if r[\"evaluation_duration_seconds\"\
          ] is not None]\n        stats[\"evaluation_duration_seconds\"] = {\n   \
          \         \"mean\": statistics.mean(durations) if durations else None,\n\
          \            \"std\": statistics.stdev(durations) if len(durations) > 1\
          \ else 0.0\n        }\n\n        all_metric_names = set()\n        for run\
          \ in runs:\n            all_metric_names.update(run[\"metrics\"].keys())\n\
          \n        metrics_stats = {}\n        for metric_name in all_metric_names:\n\
          \            values = [run[\"metrics\"][metric_name][\"value\"] for run\
          \ in runs if metric_name in run[\"metrics\"] and run[\"metrics\"][metric_name][\"\
          value\"] is not None]\n            stderrs = [run[\"metrics\"][metric_name][\"\
          stderr\"] for run in runs if metric_name in run[\"metrics\"] and run[\"\
          metrics\"][metric_name][\"stderr\"] is not None]\n\n            metrics_stats[metric_name]\
          \ = {\n                \"value\": {\n                    \"mean\": statistics.mean(values)\
          \ if values else None,\n                    \"std\": statistics.stdev(values)\
          \ if len(values) > 1 else 0.0\n                },\n                \"stderr\"\
          : {\n                    \"mean\": statistics.mean(stderrs) if stderrs else\
          \ None,\n                    \"std\": statistics.stdev(stderrs) if len(stderrs)\
          \ > 1 else 0.0\n                }\n            }\n        stats[\"metrics\"\
          ] = metrics_stats\n        return stats\n\n    def group_results(all_results):\n\
          \        \"\"\"Group results by (task_name, model_name, model_type).\"\"\
          \"\n        groups = defaultdict(list)\n        for result in all_results:\n\
          \            # model_type was already set in parse_json_files\n        \
          \    model_type = result[\"model_type\"]\n            key = (result[\"task_name\"\
          ], result[\"model_name\"], model_type)\n            groups[key].append(result)\n\
          \n        grouped_results = []\n        for (task_name, model_name, model_type),\
          \ runs in groups.items():\n            first_run = runs[0]\n           \
          \ run_data = [{\n                \"source_filename\": r[\"source_filename\"\
          ],\n                \"evaluation_datetime\": r[\"evaluation_datetime\"],\n\
          \                \"evaluation_datetime_iso\": r[\"evaluation_datetime_iso\"\
          ],\n                \"evaluation_duration_seconds\": r[\"evaluation_duration_seconds\"\
          ],\n                \"metrics\": r[\"metrics\"]\n            } for r in\
          \ runs]\n\n            grouped_results.append({\n                \"task_name\"\
          : task_name,\n                \"model_name\": model_name,\n            \
          \    \"model_type\": model_type,\n                \"inference_parameters\"\
          : first_run[\"inference_parameters\"],\n                \"num_repetitions\"\
          : len(runs),\n                \"aggregate_stats\": compute_aggregate_stats(runs),\n\
          \                \"runs\": run_data\n            })\n        return grouped_results\n\
          \n    # Main execution\n    session_dir = Path(save_path) / \"sessions\"\
          \ / session_id\n    baseline_dir = session_dir / \"baseline\" / \"results\"\
          \n    compressed_dir = session_dir / \"compressed\" / \"results\"\n\n  \
          \  directories = []\n    if baseline_dir.exists():\n        directories.append(str(baseline_dir))\n\
          \    if compressed_dir.exists():\n        directories.append(str(compressed_dir))\n\
          \n    if not directories:\n        print(\"No results directories found\"\
          )\n        return\n\n    json_files = scan_json_files(directories)\n   \
          \ print(f\"Found {len(json_files)} JSON files\")\n\n    all_results = parse_json_files(json_files)\n\
          \    grouped_results = group_results(all_results)\n\n    # Separate by model\
          \ type\n    baseline_results = [r for r in grouped_results if r[\"model_type\"\
          ] == \"baseline\"]\n    compressed_results = [r for r in grouped_results\
          \ if r[\"model_type\"] == \"compressed\"]\n\n    unique_tasks = sorted(set(r[\"\
          task_name\"] for r in all_results))\n    unique_models = sorted(set(r[\"\
          model_name\"] for r in all_results if r.get(\"model_name\")))\n\n    output_data\
          \ = {\n        \"baseline_results\": baseline_results,\n        \"compressed_results\"\
          : compressed_results,\n        \"metadata\": {\n            \"parser_version\"\
          : \"1.0\",\n            \"parse_datetime\": datetime.now(timezone.utc).isoformat(),\n\
          \            \"session_id\": session_id,\n            \"model_id\": model_id,\n\
          \            \"compression_recipe\": compression_recipe,\n            \"\
          total_results_parsed\": len(all_results),\n            \"total_files_parsed\"\
          : len(json_files),\n            \"unique_tasks\": unique_tasks,\n      \
          \      \"unique_models\": unique_models\n        }\n    }\n\n    output_dir\
          \ = session_dir / \"collated\"\n    output_dir.mkdir(parents=True, exist_ok=True)\n\
          \    output_path = output_dir / \"collated_results.json\"\n\n    with open(output_path,\
          \ \"w\") as f:\n        json.dump(output_data, f, indent=2)\n\n    print(f\"\
          Collated results written to: {output_path}\")\n    print(f\"Baseline results:\
          \ {len(baseline_results)}\")\n    print(f\"Compressed results: {len(compressed_results)}\"\
          )\n\n"
        image: python:3.12
    exec-compress-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - compress_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
