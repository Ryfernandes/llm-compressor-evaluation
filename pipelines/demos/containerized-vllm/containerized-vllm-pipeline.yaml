# PIPELINE DEFINITION
# Name: managed-permanent-vllm-server
# Inputs:
#    prompt: str [Default: 'Concisely and formally prove that there are infinitely many prime numbers.']
#    session_id: str
components:
  comp-clean-session-id:
    executorLabel: exec-clean-session-id
    inputDefinitions:
      parameters:
        session_id:
          parameterType: STRING
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-create-vllm-server:
    executorLabel: exec-create-vllm-server
    inputDefinitions:
      parameters:
        dp:
          defaultValue: '1'
          isOptional: true
          parameterType: STRING
        fs_group:
          defaultValue: 1000770000.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        hf_secret_name:
          defaultValue: ryan-test-hf-hub-secret
          isOptional: true
          parameterType: STRING
        max_model_len:
          defaultValue: 32768.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        model:
          defaultValue: Qwen/Qwen3-8B
          isOptional: true
          parameterType: STRING
        namespace:
          defaultValue: machine-learning
          isOptional: true
          parameterType: STRING
        node_selector_key:
          defaultValue: node-role.kubernetes.io/up-h100mcp
          isOptional: true
          parameterType: STRING
        pod_suffix:
          defaultValue: baseline-server
          isOptional: true
          parameterType: STRING
        service_account_name:
          defaultValue: ml-workload
          isOptional: true
          parameterType: STRING
        session_id:
          parameterType: STRING
        tier1_size:
          defaultValue: 50Gi
          isOptional: true
          parameterType: STRING
        tier1_storage_class:
          defaultValue: lvms-h100-tier1-storage
          isOptional: true
          parameterType: STRING
        tier2_pvc_name:
          defaultValue: evaluation-pipeline-model-server-tier-2
          isOptional: true
          parameterType: STRING
        tp:
          defaultValue: '1'
          isOptional: true
          parameterType: STRING
        wait_timeout_seconds:
          defaultValue: 2700.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-delete-vllm-server:
    executorLabel: exec-delete-vllm-server
    inputDefinitions:
      parameters:
        delete_tier2_pvc:
          defaultValue: false
          isOptional: true
          parameterType: BOOLEAN
        namespace:
          defaultValue: machine-learning
          isOptional: true
          parameterType: STRING
        pod_suffix:
          defaultValue: baseline-server
          isOptional: true
          parameterType: STRING
        session_id:
          parameterType: STRING
        tier2_pvc_name:
          defaultValue: evaluation-pipeline-model-server-tier-2
          isOptional: true
          parameterType: STRING
  comp-exit-handler-1:
    dag:
      tasks:
        create-vllm-server:
          cachingOptions: {}
          componentRef:
            name: comp-create-vllm-server
          inputs:
            parameters:
              session_id:
                componentInputParameter: pipelinechannel--clean-session-id-Output
          taskInfo:
            name: create-vllm-server
        test-vllm-server:
          cachingOptions: {}
          componentRef:
            name: comp-test-vllm-server
          dependentTasks:
          - create-vllm-server
          inputs:
            parameters:
              prompt:
                componentInputParameter: pipelinechannel--prompt
              service_url:
                taskOutputParameter:
                  outputParameterKey: Output
                  producerTask: create-vllm-server
          taskInfo:
            name: test-vllm-server
    inputDefinitions:
      parameters:
        pipelinechannel--clean-session-id-Output:
          parameterType: STRING
        pipelinechannel--prompt:
          parameterType: STRING
  comp-test-vllm-server:
    executorLabel: exec-test-vllm-server
    inputDefinitions:
      parameters:
        model:
          defaultValue: Qwen/Qwen3-8B
          isOptional: true
          parameterType: STRING
        prompt:
          parameterType: STRING
        service_url:
          parameterType: STRING
deploymentSpec:
  executors:
    exec-clean-session-id:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - clean_session_id
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef clean_session_id(session_id: str) -> str:\n    return session_id.replace(\"\
          _\", \"-\").lower()\n\n"
        image: python:3.12
    exec-create-vllm-server:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - create_vllm_server
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kubernetes'\
          \ 'requests'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.16.1' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef create_vllm_server(\n    session_id: str,\n    namespace: str\
          \ = \"machine-learning\",\n    pod_suffix: str = \"baseline-server\",\n\
          \    service_account_name: str = \"ml-workload\",\n    model: str = \"Qwen/Qwen3-8B\"\
          ,\n    hf_secret_name: str = \"ryan-test-hf-hub-secret\",\n    tier2_pvc_name:\
          \ str = \"evaluation-pipeline-model-server-tier-2\",\n    fs_group: int\
          \ = 1000770000,\n    max_model_len: int = 32768,\n    tp: str = \"1\",\n\
          \    dp: str = \"1\",\n    tier1_storage_class: str = \"lvms-h100-tier1-storage\"\
          ,\n    tier1_size: str = \"50Gi\",\n    node_selector_key: str = \"node-role.kubernetes.io/up-h100mcp\"\
          ,\n    wait_timeout_seconds: int = 2700,\n) -> str:\n    import time\n \
          \   import requests\n    from kubernetes import client, config\n    from\
          \ kubernetes.client.rest import ApiException\n\n    config.load_incluster_config()\n\
          \    core = client.CoreV1Api()\n\n    pod_name = f\"{namespace}--{session_id}--{pod_suffix}\"\
          \n    service_name = f\"{pod_name}-svc\"\n\n    labels = {\n        \"app.kubernetes.io/instance\"\
          : pod_name,\n    }\n\n    service_url = f\"http://{service_name}.{namespace}.svc.cluster.local:8000\"\
          \n\n    script = r'''\nset -eu\n\nexport HF_HOME=\"/tier2/hf-hub\"\nexport\
          \ HF_HUB_CACHE=\"/tier2/hf-hub\"\nexport OMP_NUM_THREADS=1\nexport MKL_NUM_THREADS=1\n\
          export OPENBLAS_NUM_THREADS=1\nexport NUMEXPR_NUM_THREADS=1\nexport VLLM_WORKER_MULTIPROC_METHOD=spawn\n\
          \nmkdir -p \\\n  \"$HF_HOME\" \\\n  \"$HOME\" \\\n  \"$XDG_CACHE_HOME\"\
          \ \\\n  \"$TORCH_HOME\" \\\n  \"$TORCHINDUCTOR_CACHE_DIR\" \\\n  \"$TRITON_CACHE_DIR\"\
          \ \\\n  \"$VLLM_CACHE_ROOT\"\n\nLOCAL_MODEL=\"/tier1/model\"\n\necho \"\
          [*] Resolving/downloading model from Hugging Face...\"\nCACHE_PATH=$(python3\
          \ -c \"\nfrom huggingface_hub import snapshot_download\nprint(snapshot_download('${MODEL}'))\n\
          \")\necho \"[+] HF cache path: ${CACHE_PATH}\"\n\necho \"[*] Copying model\
          \ to tier1 NVMe...\"\nrm -rf \"$LOCAL_MODEL\"\nmkdir -p \"$LOCAL_MODEL\"\
          \ncp -rL \"$CACHE_PATH\"/. \"$LOCAL_MODEL\"/\necho \"[+] Model copied to\
          \ ${LOCAL_MODEL}\"\n\necho \"================================================================\"\
          \necho \" Starting vLLM Server\"\necho \" HF model: ${MODEL}\"\necho \"\
          \ Local path: ${LOCAL_MODEL}\"\necho \" TP=${TP}, DP=${DP}\"\necho \"================================================================\"\
          \n\nexec vllm serve \"$LOCAL_MODEL\" \\\n  --served-model-name \"$MODEL\"\
          \ \\\n  --tensor-parallel-size \"${TP}\" \\\n  --data-parallel-size \"${DP}\"\
          \ \\\n  --max-model-len \"${MAX_MODEL_LEN}\" \\\n  --host 0.0.0.0 \\\n \
          \ --port 8000\n'''\n\n    pod_manifest = {\n        \"apiVersion\": \"v1\"\
          ,\n        \"kind\": \"Pod\",\n        \"metadata\": {\n            \"name\"\
          : pod_name,\n            \"namespace\": namespace,\n            \"labels\"\
          : labels,\n        },\n        \"spec\": {\n            \"restartPolicy\"\
          : \"Never\",\n            \"serviceAccountName\": service_account_name,\n\
          \            \"securityContext\": {\n                \"fsGroup\": fs_group,\n\
          \                \"fsGroupChangePolicy\": \"Always\",\n            },\n\
          \            \"nodeSelector\": {\n                node_selector_key: \"\"\
          ,\n            },\n            \"containers\": [\n                {\n  \
          \                  \"name\": \"vllm-server\",\n                    \"image\"\
          : \"vllm/vllm-openai:v0.22.1\",\n                    \"ports\": [\n    \
          \                    {\n                            \"name\": \"http\",\n\
          \                            \"containerPort\": 8000,\n                \
          \            \"protocol\": \"TCP\",\n                        }\n       \
          \             ],\n                    \"command\": [\"/bin/bash\", \"-c\"\
          , script],\n                    \"readinessProbe\": {\n                \
          \        \"httpGet\": {\n                            \"path\": \"/v1/models\"\
          ,\n                            \"port\": \"http\",\n                   \
          \     },\n                        \"initialDelaySeconds\": 30,\n       \
          \                 \"periodSeconds\": 15,\n                        \"timeoutSeconds\"\
          : 10,\n                        \"failureThreshold\": 120,\n            \
          \        },\n                    \"resources\": {\n                    \
          \    \"requests\": {\n                            \"nvidia.com/gpu\": \"\
          1\",\n                        },\n                        \"limits\": {\n\
          \                            \"nvidia.com/gpu\": \"1\",\n              \
          \          },\n                    },\n                    \"env\": [\n\
          \                        {\"name\": \"MODEL\", \"value\": model},\n    \
          \                    {\"name\": \"TP\", \"value\": tp},\n              \
          \          {\"name\": \"DP\", \"value\": dp},\n                        {\"\
          name\": \"MAX_MODEL_LEN\", \"value\": str(max_model_len)},\n           \
          \             {\n                            \"name\": \"HF_TOKEN\",\n \
          \                           \"valueFrom\": {\n                         \
          \       \"secretKeyRef\": {\n                                    \"name\"\
          : hf_secret_name,\n                                    \"key\": \"HF_TOKEN\"\
          ,\n                                }\n                            },\n \
          \                       },\n                        {\"name\": \"NVIDIA_VISIBLE_DEVICES\"\
          , \"value\": \"all\"},\n                        {\"name\": \"NVIDIA_DRIVER_CAPABILITIES\"\
          , \"value\": \"compute,utility\"},\n                        {\"name\": \"\
          RAYON_NUM_THREADS\", \"value\": \"1\"},\n                        {\"name\"\
          : \"VLLM_ENGINE_READY_TIMEOUT_S\", \"value\": \"1800\"},\n\n           \
          \             {\"name\": \"HOME\", \"value\": \"/tier2/home\"},\n      \
          \                  {\"name\": \"USER\", \"value\": \"vllm\"},\n        \
          \                {\"name\": \"LOGNAME\", \"value\": \"vllm\"},\n       \
          \                 {\"name\": \"XDG_CACHE_HOME\", \"value\": \"/tier2/cache\"\
          },\n                        {\"name\": \"TORCH_HOME\", \"value\": \"/tier2/cache/torch\"\
          },\n                        {\"name\": \"TORCHINDUCTOR_CACHE_DIR\", \"value\"\
          : \"/tier2/cache/torchinductor\"},\n                        {\"name\": \"\
          TRITON_CACHE_DIR\", \"value\": \"/tier2/cache/triton\"},\n             \
          \           {\"name\": \"VLLM_CACHE_ROOT\", \"value\": \"/tier2/cache/vllm\"\
          },\n                    ],\n                    \"volumeMounts\": [\n  \
          \                      {\"name\": \"tier1\", \"mountPath\": \"/tier1\"},\n\
          \                        {\"name\": \"tier2\", \"mountPath\": \"/tier2\"\
          },\n                    ],\n                    \"envFrom\": [\n       \
          \                 {\"configMapRef\": {\"name\": \"ceph-bucket-class\"}},\n\
          \                        {\"secretRef\": {\"name\": \"ceph-bucket-class\"\
          }},\n                    ],\n                }\n            ],\n       \
          \     \"volumes\": [\n                {\n                    \"name\": \"\
          tier1\",\n                    \"ephemeral\": {\n                       \
          \ \"volumeClaimTemplate\": {\n                            \"metadata\":\
          \ {\n                                \"labels\": {\n                   \
          \                 \"type\": \"ephemeral-volume\",\n                    \
          \            }\n                            },\n                       \
          \     \"spec\": {\n                                \"accessModes\": [\"\
          ReadWriteOnce\"],\n                                \"storageClassName\"\
          : tier1_storage_class,\n                                \"resources\": {\n\
          \                                    \"requests\": {\n                 \
          \                       \"storage\": tier1_size,\n                     \
          \               }\n                                },\n                \
          \            },\n                        }\n                    },\n   \
          \             },\n                {\n                    \"name\": \"tier2\"\
          ,\n                    \"persistentVolumeClaim\": {\n                  \
          \      \"claimName\": tier2_pvc_name,\n                    },\n        \
          \        },\n            ],\n        },\n    }\n\n    service_manifest =\
          \ {\n        \"apiVersion\": \"v1\",\n        \"kind\": \"Service\",\n \
          \       \"metadata\": {\n            \"name\": service_name,\n         \
          \   \"namespace\": namespace,\n        },\n        \"spec\": {\n       \
          \     \"type\": \"ClusterIP\",\n            \"selector\": labels,\n    \
          \        \"ports\": [\n                {\n                    \"name\":\
          \ \"http\",\n                    \"protocol\": \"TCP\",\n              \
          \      \"port\": 8000,\n                    \"targetPort\": \"http\",\n\
          \                }\n            ],\n        },\n    }\n\n    def delete_pod_if_exists()\
          \ -> None:\n        try:\n            core.delete_namespaced_pod(name=pod_name,\
          \ namespace=namespace)\n            print(f\"Deleted existing pod {pod_name};\
          \ waiting for deletion...\")\n        except ApiException as e:\n      \
          \      if e.status != 404:\n                raise\n            return\n\n\
          \        deadline = time.time() + 300\n        while time.time() < deadline:\n\
          \            try:\n                core.read_namespaced_pod(name=pod_name,\
          \ namespace=namespace)\n                time.sleep(5)\n            except\
          \ ApiException as e:\n                if e.status == 404:\n            \
          \        return\n                raise\n        raise TimeoutError(f\"Timed\
          \ out waiting for old pod {pod_name} to delete\")\n\n    def create_or_patch_service()\
          \ -> None:\n        try:\n            core.create_namespaced_service(namespace=namespace,\
          \ body=service_manifest)\n            print(f\"Created service {service_name}\"\
          )\n        except ApiException as e:\n            if e.status ==409:\n \
          \               core.patch_namespaced_service(\n                    name=service_name,\n\
          \                    namespace=namespace,\n                    body=service_manifest,\n\
          \                )\n                print(f\"Patched existing service {service_name}\"\
          )\n            else:\n                raise\n\n    def create_pod() -> None:\n\
          \        core.create_namespaced_pod(namespace=namespace, body=pod_manifest)\n\
          \        print(f\"Created pod {pod_name}\")\n\n    def wait_for_pod_ready()\
          \ -> None:\n        deadline = time.time() + wait_timeout_seconds\n\n  \
          \      while time.time() < deadline:\n            pod = core.read_namespaced_pod(name=pod_name,\
          \ namespace=namespace)\n            phase = pod.status.phase\n         \
          \   conditions = pod.status.conditions or []\n\n            ready = any(\n\
          \                condition.type == \"Ready\" and condition.status == \"\
          True\"\n                for condition in conditions\n            )\n\n \
          \           print(f\"Pod phase={phase}, ready={ready}\")\n\n           \
          \ if ready:\n                return\n\n            if phase in {\"Failed\"\
          , \"Succeeded\"}:\n                raise RuntimeError(f\"Pod ended before\
          \ becoming ready: phase={phase}\")\n\n            time.sleep(15)\n\n   \
          \     raise TimeoutError(f\"Timed out waiting for pod {pod_name} to become\
          \ ready\")\n\n    def wait_for_service_healthy() -> None:\n        deadline\
          \ = time.time() + 1800\n        url = f\"{service_url}/v1/models\"\n\n \
          \       while time.time() < deadline:\n            try:\n              \
          \  response = requests.get(url, timeout=10)\n                if response.ok:\n\
          \                    print(f\"Service healthy: {response.text[:500]}\")\n\
          \                    return\n                print(f\"Service responded\
          \ with HTTP {response.status_code}: {response.text[:300]}\")\n         \
          \   except Exception as e:\n                print(f\"Service not ready yet:\
          \ {e}\")\n\n            time.sleep(10)\n\n        raise TimeoutError(f\"\
          Timed out waiting for {url}\")\n\n    create_or_patch_service()\n\n    delete_pod_if_exists()\n\
          \    create_pod()\n\n    wait_for_pod_ready()\n    wait_for_service_healthy()\n\
          \n    print(f\"vLLM service URL: {service_url}\")\n    return service_url\n\
          \n"
        image: python:3.12
    exec-delete-vllm-server:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - delete_vllm_server
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kubernetes'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef delete_vllm_server(\n    session_id: str,\n    namespace: str\
          \ = \"machine-learning\",\n    pod_suffix: str = \"baseline-server\",\n\
          \    tier2_pvc_name: str = \"evaluation-pipeline-model-server-tier-2\",\n\
          \    delete_tier2_pvc: bool = False,\n) -> None:\n    import time\n    from\
          \ kubernetes import client, config\n    from kubernetes.client.rest import\
          \ ApiException\n\n    config.load_incluster_config()\n    core = client.CoreV1Api()\n\
          \n    pod_name = f\"{namespace}--{session_id}--{pod_suffix}\"\n    service_name\
          \ = f\"{pod_name}-svc\"\n\n    def ignore_404(fn, description: str) -> None:\n\
          \        try:\n            fn()\n            print(f\"Deleted {description}\"\
          )\n        except ApiException as e:\n            if e.status == 404:\n\
          \                print(f\"{description} did not exist\")\n            else:\n\
          \                raise\n\n    ignore_404(\n        lambda: core.delete_namespaced_pod(name=pod_name,\
          \ namespace=namespace),\n        f\"pod/{pod_name}\",\n    )\n\n    ignore_404(\n\
          \        lambda: core.delete_namespaced_service(name=service_name, namespace=namespace),\n\
          \        f\"service/{service_name}\",\n    )\n\n    tier1_pvc_name = f\"\
          {pod_name}-tier1\"\n    ignore_404(\n        lambda: core.delete_namespaced_persistent_volume_claim(\n\
          \            name=tier1_pvc_name,\n            namespace=namespace,\n  \
          \      ),\n        f\"pvc/{tier1_pvc_name}\",\n    )\n\n    if delete_tier2_pvc:\n\
          \        ignore_404(\n            lambda: core.delete_namespaced_persistent_volume_claim(\n\
          \                name=tier2_pvc_name,\n                namespace=namespace,\n\
          \            ),\n            f\"pvc/{tier2_pvc_name}\",\n        )\n   \
          \ else:\n        print(f\"Preserved tier2 PV: {tier2_pvc_name}\")\n\n  \
          \  # Wait for pod deletion to complete\n    deadline = time.time() + 300\n\
          \    while time.time() < deadline:\n        try:\n            core.read_namespaced_pod(name=pod_name,\
          \ namespace=namespace)\n            print(\"Waiting for pod deletion...\"\
          )\n            time.sleep(5)\n        except ApiException as e:\n      \
          \      if e.status == 404:\n                print(\"Pod deletion complete\"\
          )\n                return\n            raise\n\n    print(\"Timed out waiting\
          \ for pod deletion, but delete was requested\")\n\n"
        image: python:3.12
    exec-test-vllm-server:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - test_vllm_server
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'requests'  &&\
          \  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.16.1'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef test_vllm_server(\n    service_url: str,\n    prompt: str,\n\
          \    model: str = \"Qwen/Qwen3-8B\",\n) -> None:\n    import json\n    import\
          \ requests\n\n    models_url = f\"{service_url}/v1/models\"\n    print(f\"\
          Checking {models_url}\")\n\n    models_response = requests.get(models_url,\
          \ timeout=30)\n    models_response.raise_for_status()\n    print(json.dumps(models_response.json(),\
          \ indent=2))\n\n    chat_url = f\"{service_url}/v1/chat/completions\"\n\
          \    payload = {\n        \"model\": model,\n        \"messages\": [\n \
          \           {\n                \"role\": \"user\",\n                \"content\"\
          : prompt,\n            }\n        ],\n        \"max_tokens\": 2048,\n  \
          \      \"temperature\": 0.6,\n        \"chat_template_kwargs\": {\n    \
          \        \"enable_thinking\": True,\n        },\n    }\n\n    response =\
          \ requests.post(chat_url, json=payload, timeout=120)\n    response.raise_for_status()\n\
          \n    data = response.json()\n    print(json.dumps(data, indent=2))\n  \
          \  print(\"Assistant response:\")\n    print(data[\"choices\"][0][\"message\"\
          ][\"content\"])\n\n"
        image: python:3.12
pipelineInfo:
  name: managed-permanent-vllm-server
root:
  dag:
    tasks:
